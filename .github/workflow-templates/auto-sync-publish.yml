# INACTIVE TEMPLATE. No Pages or production permissions are requested until a
# separately approved main merge, Pages source cutover and activation.
name: MUSDB validated Pages publisher
on:
  workflow_run:
    workflows: [MUSDB revision monitor]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      monitor_run_id:
        description: Completed trusted main monitor run to inspect again
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: musdb-pages-production
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.ref == 'refs/heads/main' && vars.MUSDB_AUTO_SYNC_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - id: monitor
        name: Validate trusted monitor identity before artifact download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id || inputs.monitor_run_id }}
        run: node tools/auto-sync/cli.cjs validate-monitor --run-id="$MONITOR_RUN_ID" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: steps.monitor.outputs.run_id != ''
        with:
          name: sync-monitor-plan
          run-id: ${{ steps.monitor.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/monitor-artifact
      - id: plan
        if: steps.monitor.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/auto-sync/cli.cjs validate-plan --plan="$RUNNER_TEMP/monitor-artifact/plan.json" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: steps.plan.outputs.decision == 'BUILD'
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/musdb-sync/accepted-plan.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: plan
    if: needs.plan.outputs.decision == 'BUILD'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    environment: musdb-sync-signing
    outputs:
      validated: ${{ steps.build.outputs.validated }}
    env:
      MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/plan
      - name: Install the AUTO-SYNC-12 pinned capture and test environment
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y 'fonts-noto-cjk=1:20230817+repack1-3' libnss3 libatk-bridge2.0-0t64 libxkbcommon0 libgbm1 libasound2t64
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3'
          curl --fail --silent --show-error --location --retry 0 'https://storage.googleapis.com/chrome-for-testing-public/158.0.8127.36/linux64/chrome-linux64.zip' -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/pinned-chrome"
          sudo mkdir -p /opt/google/chrome
          sudo ln -sf "$RUNNER_TEMP/pinned-chrome/chrome-linux64/chrome" /opt/google/chrome/chrome
          node tests/node_modules/playwright/cli.js install chromium
      - name: Preflight default test Chromium before heavy generation
        env:
          AUTO_SYNC_CI: '1'
          AUTO_SYNC_OUTPUT: ${{ runner.temp }}/musdb-sync
        run: node tools/ci/test-environment.cjs --preflight
      - id: build
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/auto-sync/cli.cjs build --plan="$RUNNER_TEMP/plan/accepted-plan.json" --out="$RUNNER_TEMP/musdb-sync"
      - name: Store validated public site for the separate deploy job
        if: steps.build.outputs.validated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/musdb-sync/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Store build receipt
        if: steps.build.outputs.validated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sync-build-receipt
          path: ${{ runner.temp }}/musdb-sync/build.json
          if-no-files-found: error
      - name: Sanitize evidence, including failures, before artifact upload
        if: always()
        run: node tools/auto-sync/cli.cjs evidence --out="$RUNNER_TEMP/musdb-sync" --destination="$RUNNER_TEMP/sync-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-build-evidence
          path: ${{ runner.temp }}/sync-evidence
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: [plan, build]
    if: needs.build.outputs.validated == 'true' && vars.MUSDB_AUTO_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      deployed: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/site
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-build-receipt
          path: ${{ runner.temp }}/receipt
      - id: gate
        name: Fresh revision, main, privacy and bundle integrity gate
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
        run: node tools/auto-sync/cli.cjs predeploy --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --build="$RUNNER_TEMP/receipt/build.json" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: steps.gate.outputs.allowed == 'true'
        with:
          path: ${{ runner.temp }}/site
      - id: freshness
        name: Recheck immediately after upload and before deployment
        if: steps.gate.outputs.allowed == 'true'
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
        run: node tools/auto-sync/cli.cjs predeploy --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --build="$RUNNER_TEMP/receipt/build.json" --out="$RUNNER_TEMP/musdb-sync"
      - id: pages
        if: steps.freshness.outputs.allowed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-deployment-state
          path: ${{ runner.temp }}/musdb-sync/*.json
          retention-days: 14
  verify:
    needs: [plan, build, deploy]
    if: needs.deploy.outputs.deployed == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: musdb-sync-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/site
      - name: Confirm actual domain revision and file hashes; no automatic rollback
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_DEPLOY_CONCLUSION: ${{ needs.deploy.outputs.deployed }}
        run: node tools/auto-sync/cli.cjs verify --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-http-verification-state
          path: ${{ runner.temp }}/musdb-sync/*.json
          retention-days: 14
