name: MUSDB Pages baseline migration

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Restore the explicitly selected, verified published bundle
        type: boolean
        default: false
      recovery_target:
        description: Verified publication to restore
        type: choice
        required: true
        default: none
        options:
          - none
          - pages-44928928159
      recovery_ticket:
        description: One-time approval recorded by the publication coordinator
        type: string
        default: ''

permissions: {}

concurrency:
  group: musdb-pages-production
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'xenotopi/mus-song-database' && github.repository_id == '1318600615' &&
      github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1 &&
      inputs.deploy == true && inputs.recovery_target != 'none' && inputs.recovery_ticket != '' &&
      vars.MUSDB_AUTO_SYNC_ENABLED != 'true' && vars.MUSDB_EVENT_MONITOR_ENABLED != 'true' && vars.MUSDB_EVENT_PUBLICATION_ENABLED != 'true' &&
      vars.MUSDB_PUBLICATION_FENCE_ENABLED == 'true' && vars.MUSDB_PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      allowed: ${{ steps.diff.outputs.allowed }}
      run_id: ${{ steps.diff.outputs.run_id }}
      receipt_sha256: ${{ steps.diff.outputs.receipt_sha256 }}
      inventory_sha256: ${{ steps.diff.outputs.inventory_sha256 }}
      target_sha256: ${{ steps.diff.outputs.target_sha256 }}
      release_id: ${{ steps.diff.outputs.release_id }}
      asset_id: ${{ steps.diff.outputs.asset_id }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MUSDB_PAGES_DEPLOY_ENABLED: ${{ vars.MUSDB_PAGES_DEPLOY_ENABLED }}
      MUSDB_RUN_REF_PROTECTED: ${{ github.ref_protected }}
      RECOVERY_TARGET: ${{ inputs.recovery_target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - id: selection
        name: Verify the pinned Recovery Release and Asset against GitHub
        run: node tools/auto-sync/cli.cjs recovery-select --target="$RECOVERY_TARGET" --out="$RUNNER_TEMP/recovery-select"
      - name: Download and verify the Release Asset before extraction
        env:
          ASSET_ID: ${{ steps.selection.outputs.asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          archive="$RUNNER_TEMP/recovery.zip"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$archive"
          node tools/auto-sync/cli.cjs recovery-archive --target="$RECOVERY_TARGET" --archive="$archive" --out="$RUNNER_TEMP/recovery-archive"
          mkdir "$RUNNER_TEMP/pages-recovery"
          unzip -q "$archive" -d "$RUNNER_TEMP/pages-recovery"
      - id: diff
        name: Verify the recovery bundle against the current published inventory
        run: node tools/auto-sync/cli.cjs recovery-diff --target="$RECOVERY_TARGET" --site="$RUNNER_TEMP/pages-recovery" --out="$RUNNER_TEMP/recovery-diff"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: vars.MUSDB_PAGES_DEPLOY_ENABLED == 'true' && steps.diff.outputs.allowed == 'true'
        with:
          path: ${{ runner.temp }}/pages-recovery

  deploy:
    if: >-
      needs.prepare.outputs.allowed == 'true' && inputs.deploy == true && inputs.recovery_target != 'none' &&
      inputs.recovery_ticket != '' && github.repository == 'xenotopi/mus-song-database' && github.repository_id == '1318600615' &&
      github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1 &&
      vars.MUSDB_AUTO_SYNC_ENABLED != 'true' && vars.MUSDB_EVENT_MONITOR_ENABLED != 'true' && vars.MUSDB_EVENT_PUBLICATION_ENABLED != 'true' &&
      vars.MUSDB_PUBLICATION_FENCE_ENABLED == 'true' && vars.MUSDB_PAGES_DEPLOY_ENABLED == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Require Actions source and unchanged domain settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          settings=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type, .cname, .https_enforced] | @tsv')
          test "$settings" = $'workflow\tmus-song-db.com\ttrue'
      - id: baseline
        name: Recheck the published inventory before consuming the approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MUSDB_PAGES_DEPLOY_ENABLED: ${{ vars.MUSDB_PAGES_DEPLOY_ENABLED }}
          MUSDB_RUN_REF_PROTECTED: ${{ github.ref_protected }}
          BASELINE_RUN: ${{ needs.prepare.outputs.run_id }}
          BASELINE_RECEIPT: ${{ needs.prepare.outputs.receipt_sha256 }}
          BASELINE_INVENTORY: ${{ needs.prepare.outputs.inventory_sha256 }}
          RECOVERY_TARGET: ${{ inputs.recovery_target }}
          RECOVERY_TARGET_SHA256: ${{ needs.prepare.outputs.target_sha256 }}
          RECOVERY_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RECOVERY_ASSET_ID: ${{ needs.prepare.outputs.asset_id }}
        run: node tools/auto-sync/cli.cjs recheck-recovery --target="$RECOVERY_TARGET" --target-sha256="$RECOVERY_TARGET_SHA256" --release-id="$RECOVERY_RELEASE_ID" --asset-id="$RECOVERY_ASSET_ID" --run-id="$BASELINE_RUN" --receipt-sha256="$BASELINE_RECEIPT" --inventory-sha256="$BASELINE_INVENTORY" --out="$RUNNER_TEMP/recovery-diff"
      - id: recovery
        name: Consume the baseline approval and hold the publication fence
        if: steps.baseline.outputs.allowed == 'true'
        env:
          MUSDB_PUBLICATION_FENCE_ENABLED: ${{ vars.MUSDB_PUBLICATION_FENCE_ENABLED }}
          MUSDB_PAGES_DEPLOY_ENABLED: ${{ vars.MUSDB_PAGES_DEPLOY_ENABLED }}
          MUSDB_RUN_REF_PROTECTED: ${{ github.ref_protected }}
          MUSDB_DIRECT_FENCE_KEY: ${{ secrets.MUSDB_DIRECT_BASELINE_KEY }}
          MUSDB_BASELINE_RECOVERY_TICKET: ${{ inputs.recovery_ticket }}
          MUSDB_RECOVERY_TARGET: ${{ inputs.recovery_target }}
          MUSDB_RECOVERY_TARGET_SHA256: ${{ needs.prepare.outputs.target_sha256 }}
          MUSDB_RECOVERY_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          MUSDB_RECOVERY_ASSET_ID: ${{ needs.prepare.outputs.asset_id }}
        run: node tools/auto-sync/publication-fence.cjs baseline-begin
      - id: deployment
        if: vars.MUSDB_PAGES_DEPLOY_ENABLED == 'true' && steps.baseline.outputs.allowed == 'true' && steps.recovery.outputs.allowed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      # Keep the coordinator lease until Pages and the restored bytes have been reviewed.
