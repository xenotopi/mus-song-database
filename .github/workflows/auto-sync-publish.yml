# Manual publication plus the guarded completion-event route.
name: MUSDB validated Pages publisher
on:
  workflow_run:
    workflows: [MUSDB revision monitor]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      monitor_run_id:
        description: Completed trusted main monitor run to inspect again
        type: string
        required: true
      publish:
        description: Authorize deployment only if all publication gates pass
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
env:
  MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
  MUSDB_EVENT_PUBLICATION_ENABLED: ${{ vars.MUSDB_EVENT_PUBLICATION_ENABLED }}
  MUSDB_EVENT_ACTOR_ID: ${{ vars.MUSDB_EVENT_ACTOR_ID }}
  MUSDB_RUN_REF_PROTECTED: ${{ github.ref_protected }}
  MUSDB_PUBLICATION_FENCE_ENABLED: ${{ vars.MUSDB_PUBLICATION_FENCE_ENABLED }}
  MUSDB_PAGES_DEPLOY_ENABLED: ${{ vars.MUSDB_PAGES_DEPLOY_ENABLED }}
concurrency:
  group: musdb-pages-production
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: >-
      github.repository == 'xenotopi/mus-song-database' && github.repository_id == '1318600615' &&
      github.ref == 'refs/heads/main' && github.ref_protected && vars.MUSDB_AUTO_SYNC_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
       (github.event_name == 'workflow_run' && vars.MUSDB_EVENT_PUBLICATION_ENABLED == 'true' &&
        vars.MUSDB_PUBLICATION_FENCE_ENABLED == 'true' && vars.MUSDB_EVENT_ACTOR_ID != '' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 &&
        format('{0}', github.event.workflow_run.actor.id) == vars.MUSDB_EVENT_ACTOR_ID))
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - id: monitor
        name: Validate trusted monitor identity before artifact download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_RUN_ID: ${{ github.event.workflow_run.id || inputs.monitor_run_id }}
        run: node tools/auto-sync/cli.cjs validate-monitor --run-id="$MONITOR_RUN_ID" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: steps.monitor.outputs.run_id != ''
        with:
          name: sync-monitor-plan
          run-id: ${{ steps.monitor.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/monitor-artifact
      - id: plan
        if: steps.monitor.outputs.run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/auto-sync/cli.cjs validate-plan --plan="$RUNNER_TEMP/monitor-artifact/plan.json" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: steps.plan.outputs.decision == 'CHECK'
        with:
          name: sync-candidate-plan
          path: ${{ runner.temp }}/musdb-sync/candidate-plan.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: plan
    if: needs.plan.outputs.decision == 'CHECK'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    environment:
      name: musdb-sync-signing
      deployment: false
    outputs:
      validated: ${{ steps.build.outputs.validated }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-candidate-plan
          path: ${{ runner.temp }}/plan
      - name: Require durable confirmation of the automatic monitor run
        if: github.event_name == 'workflow_run'
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ secrets.MUSDB_DIRECT_AUTO_KEY }}
        run: node tools/auto-sync/publication-fence.cjs check
      - id: authorize
        name: Bind fresh signed readiness to the verified monitor candidate
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/auto-sync/cli.cjs authorize-plan --plan="$RUNNER_TEMP/plan/candidate-plan.json" --out="$RUNNER_TEMP/musdb-sync"
      - name: Install the AUTO-SYNC-12 pinned capture and test environment
        if: steps.authorize.outputs.decision == 'BUILD'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y 'fonts-noto-cjk=1:20230817+repack1-3' libnss3 libatk-bridge2.0-0t64 libxkbcommon0 libgbm1 libasound2t64
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3'
          curl --fail --silent --show-error --location --retry 0 'https://storage.googleapis.com/chrome-for-testing-public/158.0.8127.36/linux64/chrome-linux64.zip' -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/pinned-chrome"
          sudo mkdir -p /opt/google/chrome
          sudo ln -sf "$RUNNER_TEMP/pinned-chrome/chrome-linux64/chrome" /opt/google/chrome/chrome
          node tests/node_modules/playwright/cli.js install chromium
      - name: Preflight default test Chromium before heavy generation
        if: steps.authorize.outputs.decision == 'BUILD'
        env:
          AUTO_SYNC_CI: '1'
          AUTO_SYNC_OUTPUT: ${{ runner.temp }}/musdb-sync
        run: node tools/ci/test-environment.cjs --preflight
      - id: build
        if: steps.authorize.outputs.decision == 'BUILD'
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ github.event_name == 'workflow_run' && secrets.MUSDB_DIRECT_AUTO_KEY || github.event_name == 'workflow_dispatch' && secrets.MUSDB_DIRECT_MANUAL_KEY || '' }}
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/auto-sync/cli.cjs build --plan="$RUNNER_TEMP/musdb-sync/accepted-plan.json" --out="$RUNNER_TEMP/musdb-sync"
      - name: Store the authorized plan with the validated bundle
        if: steps.build.outputs.validated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/musdb-sync/accepted-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Store validated public site for the separate deploy job
        if: steps.build.outputs.validated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/musdb-sync/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Store build receipt
        if: steps.build.outputs.validated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: sync-build-receipt
          path: ${{ runner.temp }}/musdb-sync/build.json
          if-no-files-found: error
      - name: Sanitize evidence, including failures, before artifact upload
        if: always()
        run: node tools/auto-sync/cli.cjs evidence --out="$RUNNER_TEMP/musdb-sync" --destination="$RUNNER_TEMP/sync-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-build-evidence
          path: ${{ runner.temp }}/sync-evidence
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: [plan, build]
    if: needs.build.outputs.validated == 'true' && vars.MUSDB_AUTO_SYNC_ENABLED == 'true' && vars.MUSDB_PUBLICATION_FENCE_ENABLED == 'true' && vars.MUSDB_PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: musdb-sync-signing
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      deployed: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/site
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-build-receipt
          path: ${{ runner.temp }}/receipt
      - id: gate
        name: Fresh revision, main, privacy and bundle integrity gate
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
        run: node tools/auto-sync/cli.cjs predeploy --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --build="$RUNNER_TEMP/receipt/build.json" --out="$RUNNER_TEMP/musdb-sync"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: steps.gate.outputs.allowed == 'true'
        with:
          path: ${{ runner.temp }}/site
      - id: fence
        name: Acquire the publication fence shared with management updates
        if: steps.gate.outputs.allowed == 'true'
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ github.event_name == 'workflow_run' && secrets.MUSDB_DIRECT_AUTO_KEY || github.event_name == 'workflow_dispatch' && secrets.MUSDB_DIRECT_MANUAL_KEY || '' }}
        run: node tools/auto-sync/publication-fence.cjs acquire
      - id: freshness
        name: Recheck after upload while the publication fence is held
        if: steps.fence.outputs.acquired == 'true'
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          MUSDB_AUTO_SYNC_ENABLED: ${{ vars.MUSDB_AUTO_SYNC_ENABLED }}
        run: node tools/auto-sync/cli.cjs predeploy --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --build="$RUNNER_TEMP/receipt/build.json" --out="$RUNNER_TEMP/musdb-sync"
      - id: begin
        name: Persist that a Pages request may be issued
        if: steps.freshness.outputs.allowed == 'true'
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ github.event_name == 'workflow_run' && secrets.MUSDB_DIRECT_AUTO_KEY || github.event_name == 'workflow_dispatch' && secrets.MUSDB_DIRECT_MANUAL_KEY || '' }}
        run: node tools/auto-sync/publication-fence.cjs begin
      - id: pages
        if: steps.begin.outputs.allowed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Release only if the Pages request could not have been issued
        if: ${{ !cancelled() && steps.fence.outputs.acquired == 'true' && steps.begin.outcome == 'skipped' && steps.pages.outcome == 'skipped' }}
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ github.event_name == 'workflow_run' && secrets.MUSDB_DIRECT_AUTO_KEY || github.event_name == 'workflow_dispatch' && secrets.MUSDB_DIRECT_MANUAL_KEY || '' }}
        run: node tools/auto-sync/publication-fence.cjs abandon
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-deployment-state
          path: ${{ runner.temp }}/musdb-sync/*.json
          retention-days: 14
  verify:
    needs: [plan, build, deploy]
    if: needs.deploy.outputs.deployed == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: musdb-sync-signing
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-accepted-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sync-validated-site
          path: ${{ runner.temp }}/site
      - name: Confirm actual domain revision and file hashes; no automatic rollback
        env:
          MUSDB_SYNC_SIGNING_ENABLED: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED }}
          MUSDB_SYNC_SIGNING_KID: ${{ vars.MUSDB_SYNC_SIGNING_KID }}
          MUSDB_SYNC_SIGNING_KEY: ${{ vars.MUSDB_SYNC_SIGNING_ENABLED == 'true' && secrets.MUSDB_SYNC_SIGNING_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_DEPLOY_CONCLUSION: ${{ needs.deploy.outputs.deployed }}
        run: node tools/auto-sync/cli.cjs verify --plan="$RUNNER_TEMP/plan/accepted-plan.json" --site="$RUNNER_TEMP/site" --out="$RUNNER_TEMP/musdb-sync"
      - name: Release the publication fence after successful production verification
        env:
          MUSDB_DIRECT_FENCE_KEY: ${{ github.event_name == 'workflow_run' && secrets.MUSDB_DIRECT_AUTO_KEY || github.event_name == 'workflow_dispatch' && secrets.MUSDB_DIRECT_MANUAL_KEY || '' }}
        run: node tools/auto-sync/publication-fence.cjs verified
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: sync-http-verification-state
          path: ${{ runner.temp }}/musdb-sync/*.json
          retention-days: 14
