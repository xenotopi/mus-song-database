# Read-only integration contracts. No Secrets, external API, or deployment.
name: MUSDB auto-sync safety contracts trial
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/auto-sync-safety-trial.yml'
      - 'tools/auto-sync/**'
      - 'tests/auto-sync-*.test.cjs'
      - 'tests/helpers/auto-sync-fixture.cjs'
permissions:
  contents: read
jobs:
  contracts:
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'auto-sync-19-production-integration-20261121'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix tests --ignore-scripts
      - name: Synthetic failure and concurrency contracts without GAS
        env:
          AUTO_SYNC_NETWORK_MODE: offline
          AUTO_SYNC_NETWORK_ENFORCE: '1'
          NODE_OPTIONS: --require ./tools/ci/read-only-network.cjs
        run: node --test --test-concurrency=1 tests/auto-sync-policy.test.cjs tests/auto-sync-pipeline.test.cjs tests/auto-sync-signed-readiness.test.cjs tests/auto-sync-site.test.cjs tests/auto-sync-retention.test.cjs
