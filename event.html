<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント詳細</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main><div class="crumb">ホーム › イベント詳細</div><section class="hero"><h1 id="name">読み込み中…</h1><p id="meta">API接続中</p><div class="muse-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><div class="status" id="status">読み込み中…</div><section class="grid" id="content" hidden><article class="card"><h2>基本情報</h2><dl class="info" id="info"></dl></article><article class="card"><h2>歌唱統計</h2><div class="stats" id="stats"></div></article></section></main><div id="siteFooter"></div><script type="module">import {common} from "./assets/js/common.js";import {apiGet,fmt,esc} from "./assets/js/api.js";common("event");const id=new URLSearchParams(location.search).get("id")||"EV0002";try{const r=await apiGet("event",{id}),e=r.data,t=e.statistics||{};name.textContent=e.eventName;meta.textContent=`${fmt(e.date)}｜${e.category||"—"}｜${e.eventType||"—"}`;info.innerHTML=[["イベントID",e.eventId],["開催日",fmt(e.date)],["区分",e.category],["種別",e.eventType],["会場",e.venue?.venueName||"—"]].map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1]||"—")}</dd>`).join("");stats.innerHTML=[["登録曲数",t.songCount],["重複除外",t.uniqueSongCount],["延べ人数",t.totalSingerCount],["平均人数",t.averageSingerCount]].map(x=>`<div class="stat"><div class="value">${x[1]??0}</div><div class="label">${x[0]}</div></div>`).join("");status.classList.add("hidden");content.hidden=false}catch(e){status.classList.add("error");status.textContent=e.message}</script></body></html>
