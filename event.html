<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント詳細</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main><div class="crumb">ホーム › イベント詳細</div><section class="hero"><h1 id="pageTitle">読み込み中…</h1><p id="pageMeta">API接続中</p><div class="muse-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><div class="status" id="status">読み込み中…</div><section class="grid" id="content" hidden><article class="card"><h2>基本情報</h2><dl class="info" id="info"></dl></article><article class="card"><h2>歌唱統計</h2><div class="stats" id="stats"></div></article></section><section class="section" id="songsSection" hidden><h2>披露曲一覧</h2><div class="card" style="padding:0;overflow:hidden" id="songs"></div></section></main><div id="siteFooter"></div><script type="module">import{common}from"./assets/js/common.js";import{apiGet,esc,fmt}from"./assets/js/api.js";common("event");const id=new URLSearchParams(location.search).get("id")||"EV0002";const titleEl=document.getElementById("pageTitle"),metaEl=document.getElementById("pageMeta"),statusEl=document.getElementById("status"),contentEl=document.getElementById("content"),songsSectionEl=document.getElementById("songsSection");try{const r=await apiGet("event",{id}),e=r.data,t=e.statistics||{};titleEl.textContent=e.eventName;metaEl.textContent=[fmt(e.date),e.category,e.eventType].filter(Boolean).join("｜");info.innerHTML=[["イベントID",e.eventId],["開催日",fmt(e.date)],["区分",e.category],["イベント種別",e.eventType],["Day",e.day||"—"],["公演",e.performance||"—"],["会場",e.venue?.venueName||"—"]].map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1]||"—")}</dd>`).join("");stats.innerHTML=[["登録曲数",t.songCount],["重複除外曲数",t.uniqueSongCount],["延べ歌唱人数",t.totalSingerCount],["平均歌唱人数",t.averageSingerCount]].map(x=>`<div class="stat"><div class="value">${x[1]??0}</div><div class="label">${x[0]}</div></div>`).join("");songs.innerHTML=(e.songs||[]).map(x=>`<a class="row" href="song.html?id=${encodeURIComponent(x.songId)}"><span><span class="title">${esc(x.songName)}</span><span class="meta">${esc(x.singer)}</span></span><span>›</span></a>`).join("");statusEl.hidden=true;contentEl.hidden=false;songsSectionEl.hidden=false}catch(err){statusEl.classList.add("error");statusEl.textContent=`イベントデータを取得できませんでした。${err.message}`;titleEl.textContent="イベントデータを表示できません"}</script></body></html>
