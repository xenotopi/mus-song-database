<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ランキング | μ's Song Database</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2.5.0">

  <style>
    .ranking-summary {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .ranking-summary-card,
    .ranking-toolbar {
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .ranking-summary-card {
      min-height: 108px;
      padding: 18px;
      border-radius: 18px;
    }

    .ranking-summary-value {
      color: var(--indigo);
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }

    .ranking-summary-label {
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .ranking-tabs {
      margin-top: 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ranking-tab {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
    }

    .ranking-tab.active {
      border-color: var(--indigo);
      background: var(--indigo);
      color: #fff;
    }

    .ranking-toolbar {
      margin-top: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(220px, 1.35fr) repeat(3, minmax(150px, .75fr));
      gap: 10px;
      border-radius: 18px;
    }

    .ranking-control {
      display: grid;
      gap: 6px;
    }

    .ranking-control label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .ranking-control input,
    .ranking-control select {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
    }

    .ranking-result-head {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .ranking-panel {
      margin-top: 18px;
    }

    .ranking-list {
      padding: 0;
      overflow: hidden;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }

    .ranking-row:last-child {
      border-bottom: 0;
    }

    .ranking-row:hover {
      background: #fcfcff;
    }

    .ranking-position {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--indigo-soft);
      color: var(--indigo);
      font-weight: 900;
    }

    .ranking-title {
      display: block;
      color: var(--navy);
      font-weight: 900;
      line-height: 1.45;
    }

    .ranking-meta {
      margin-top: 5px;
      display: flex;
      gap: 5px 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
    }

    .ranking-count {
      min-width: 92px;
      color: var(--indigo);
      font-size: 19px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .ranking-count small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .ranking-more-wrap {
      margin-top: 15px;
      text-align: center;
    }

    .ranking-more-button {
      min-width: 220px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--indigo);
      border-radius: 999px;
      background: #fff;
      color: var(--indigo);
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .ranking-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ranking-toolbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .ranking-toolbar {
        grid-template-columns: 1fr;
      }

      .ranking-row {
        grid-template-columns: 40px minmax(0, 1fr);
      }

      .ranking-count {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>

  <meta name="description" content="曲・イベント・会場・歌唱名義を、さまざまな条件でランキング表示できます。">
  <meta name="robots" content="index,follow,max-image-preview:large">

  <link rel="canonical" href="https://xenotopi.github.io/mus-song-database/rankings.html">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <meta property="og:site_name" content="μ's Song Database">
  <meta property="og:title" content="ランキング | μ's Song Database">
  <meta property="og:description" content="曲・イベント・会場・歌唱名義を、さまざまな条件でランキング表示できます。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xenotopi.github.io/mus-song-database/rankings.html">
  <meta property="og:image" content="https://xenotopi.github.io/mus-song-database/assets/images/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ランキング | μ's Song Database">
  <meta name="twitter:description" content="曲・イベント・会場・歌唱名義を、さまざまな条件でランキング表示できます。">
  <meta name="twitter:image" content="https://xenotopi.github.io/mus-song-database/assets/images/og-default.png">

  <meta name="theme-color" content="#4f46e5">

  <script src="assets/js/seo-v351.js?v=3.5.1" defer></script>
</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">ホーム › ランキング</div>

    <section class="hero">
      <span class="badge">ランキング</span>
      <h1>Rankings</h1>
      <p>条件を切り替えて、曲・イベント・会場・歌唱名義を比較します。</p>
      <div class="muse-line">
        <i></i><i></i><i></i><i></i><i></i>
        <i></i><i></i><i></i><i></i>
      </div>
    </section>

    <div class="status" id="status">ランキングデータを読み込んでいます…</div>

    <div class="retry-wrap">
      <button class="retry-button" id="retryButton" type="button" hidden>再試行</button>
    </div>

    <section class="ranking-summary" id="summary" hidden>
      <article class="ranking-summary-card">
        <div class="ranking-summary-value" id="songCount">0</div>
        <div class="ranking-summary-label">歌唱された曲数</div>
      </article>
      <article class="ranking-summary-card">
        <div class="ranking-summary-value" id="eventCount">0</div>
        <div class="ranking-summary-label">対象イベント数</div>
      </article>
      <article class="ranking-summary-card">
        <div class="ranking-summary-value" id="venueCount">0</div>
        <div class="ranking-summary-label">利用会場数</div>
      </article>
      <article class="ranking-summary-card">
        <div class="ranking-summary-value" id="performanceCount">0</div>
        <div class="ranking-summary-label">延べ歌唱記録数</div>
      </article>
      <article class="ranking-summary-card">
        <div class="ranking-summary-value" id="singerCount">0</div>
        <div class="ranking-summary-label">歌唱名義数</div>
      </article>
    </section>

    <div class="ranking-tabs" id="tabs" hidden>
      <button class="ranking-tab active" data-tab="songs" type="button">曲</button>
      <button class="ranking-tab" data-tab="events" type="button">イベント</button>
      <button class="ranking-tab" data-tab="venues" type="button">会場</button>
      <button class="ranking-tab" data-tab="singers" type="button">歌唱名義</button>
    </div>

    <section class="ranking-toolbar" id="toolbar" hidden>
      <div class="ranking-control">
        <label for="rankingSearch">ランキング内検索</label>
        <input id="rankingSearch" type="search" placeholder="名称を入力" autocomplete="off">
      </div>

      <div class="ranking-control">
        <label for="rankingYear">対象年</label>
        <select id="rankingYear">
          <option value="">全期間</option>
        </select>
      </div>

      <div class="ranking-control">
        <label for="rankingCategory">イベント区分</label>
        <select id="rankingCategory">
          <option value="">公式・ソロすべて</option>
          <option value="公式">公式</option>
          <option value="ソロ">ソロ</option>
        </select>
      </div>

      <div class="ranking-control">
        <label for="rankingSort">並べ替え</label>
        <select id="rankingSort"></select>
      </div>
    </section>

    <div class="ranking-result-head" id="resultHead" hidden>
      <span id="rankingCondition"></span>
      <span id="rankingResultCount"></span>
    </div>

    <section class="ranking-panel" id="songsPanel" hidden>
      <div class="section-head">
        <div><p class="kicker">SONG RANKING</p><h2>曲ランキング</h2></div>
      </div>
      <article class="card ranking-list" id="songsList"></article>
    </section>

    <section class="ranking-panel" id="eventsPanel" hidden>
      <div class="section-head">
        <div><p class="kicker">EVENT RANKING</p><h2>イベントランキング</h2></div>
      </div>
      <article class="card ranking-list" id="eventsList"></article>
    </section>

    <section class="ranking-panel" id="venuesPanel" hidden>
      <div class="section-head">
        <div><p class="kicker">VENUE RANKING</p><h2>会場ランキング</h2></div>
      </div>
      <article class="card ranking-list" id="venuesList"></article>
    </section>

    <section class="ranking-panel" id="singersPanel" hidden>
      <div class="section-head">
        <div>
          <p class="kicker">SINGER NAME RANKING</p>
          <h2>歌唱名義別 歌唱記録数ランキング</h2>
          <p class="detail-note">
            歌唱RAWに登録された名義単位で集計しています。組み合わせ名義は別名義として扱います。
          </p>
        </div>
      </div>
      <article class="card ranking-list" id="singersList"></article>
    </section>

    <div class="ranking-more-wrap" id="moreWrap" hidden>
      <button class="ranking-more-button" id="moreButton" type="button">もっと見る</button>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="assets/js/rankings-v324.js?v=3.2.4"></script>
</body>
</html>
