  <title>リリース詳細｜μ's Song Database</title>

  <link rel="stylesheet" href="assets/css/style.css?v=4.7.0">
  <style>
    .release-page{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:30px 0 88px}.release-breadcrumb{margin-bottom:18px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.release-breadcrumb a{color:inherit;text-decoration:none}.release-breadcrumb a:hover{color:var(--indigo);text-decoration:underline}
    .release-hero{position:relative;overflow:hidden;padding:32px 30px;border-radius:24px;color:#fff;background:radial-gradient(circle at 88% 8%,rgba(126,111,255,.20),transparent 27%),linear-gradient(135deg,#18213d 0%,#293263 54%,#5147c9 100%);box-shadow:0 18px 46px rgba(30,34,76,.12)}.release-hero-kicker,.release-section-kicker{margin:0;font-size:10px;font-weight:900;letter-spacing:.12em}.release-hero-kicker{color:rgba(255,255,255,.66)}.release-hero h1{max-width:980px;margin:8px 0 12px;font-size:clamp(29px,4vw,46px);line-height:1.3;letter-spacing:-.02em;overflow-wrap:anywhere}.release-hero-meta{display:flex;gap:8px 16px;flex-wrap:wrap;margin:0;color:rgba(255,255,255,.84);font-size:13px;font-weight:800}
    .release-status{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--muted);line-height:1.7}.release-status.error{color:#991b1b;border-color:#fecaca;background:#fff7f7}.release-status strong{display:block;color:inherit;font-size:17px}.release-status-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.release-status a,.release-status button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border-radius:12px;font-weight:900;text-decoration:none;cursor:pointer}.release-status a{border:1px solid var(--line);background:#fff;color:var(--indigo)}.release-status button{border:0;background:var(--indigo);color:#fff}
    .release-content{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;margin-top:24px}.release-card{min-width:0;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow)}.release-section-kicker{color:var(--indigo)}.release-card h2{margin:5px 0 18px;color:var(--navy);font-size:24px}.release-info{margin:0}.release-info-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}.release-info-row:last-child{border-bottom:0}.release-info dt{color:var(--muted);font-size:12px;font-weight:900}.release-info dd{min-width:0;margin:0;color:var(--navy);font-weight:800;overflow-wrap:anywhere}
    .release-official{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.release-official-link{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:46px;padding:0 17px;border-radius:13px;background:var(--indigo);color:#fff;font-weight:900;text-decoration:none;overflow-wrap:anywhere}.release-official-empty{margin:0;color:var(--muted);font-size:13px}
    .release-songs-note{margin:-8px 0 16px;color:var(--muted);font-size:12px;line-height:1.8}.release-song-list{border:1px solid var(--line);border-radius:16px;overflow:hidden}.release-song-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.release-song-row:last-child{border-bottom:0}.release-song-row:hover{background:#fcfcff}.release-song-copy{min-width:0}.release-song-title{display:block;color:var(--navy);font-size:16px;font-weight:900;line-height:1.55;overflow-wrap:anywhere}.release-song-display{display:block;margin-top:4px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.release-song-arrow{color:var(--indigo);font-size:22px;font-weight:900}.release-songs-empty{padding:24px 18px;border:1px solid var(--line);border-radius:16px;color:var(--muted);line-height:1.8}.release-back{display:inline-flex;margin-top:20px;color:var(--indigo);font-weight:900;text-decoration:none}.release-back:hover{text-decoration:underline}
    @media(max-width:900px){.release-content{grid-template-columns:1fr}}@media(max-width:620px){.release-page{width:min(100% - 24px,1120px);padding:18px 0 56px}.release-hero{padding:26px 20px;border-radius:20px}.release-card{padding:20px 16px}.release-info-row{grid-template-columns:1fr;gap:5px}.release-official-link{width:100%}}
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="release-page">
    <div class="release-breadcrumb"><a href="index.html">ホーム</a> › <a href="releases.html">リリース</a> › <span id="breadcrumbName">リリース詳細</span></div>
    <section class="release-hero"><p class="release-hero-kicker">RELEASE DETAIL</p><h1 id="releaseName">読み込み中…</h1><p class="release-hero-meta" id="heroMeta">APIから実データを取得しています。</p></section>
    <div class="release-status" id="status">リリースデータを読み込んでいます...</div>
    <section class="release-content" id="mainContent" hidden>
      <article class="release-card"><p class="release-section-kicker">RELEASE INFORMATION</p><h2>基本情報</h2><dl class="release-info" id="releaseInfo"></dl><div class="release-official" id="officialRelease"></div></article>
      <article class="release-card"><p class="release-section-kicker">DEBUT SONGS</p><h2>このリリースから登場した楽曲</h2><p class="release-songs-note">曲マスター上で、このリリースを初出・由来として登録している楽曲です</p><div id="debutSongs"></div></article>
    </section>
    <a class="release-back" href="releases.html">← リリース一覧へ戻る</a>
  </main>
  <div id="siteFooter"></div>
  <script type="module" src="assets/js/release-v500.js?v=5.0.0&amp;cache=release-detail"></script>
</body>
</html>
