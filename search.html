.search-page .status.hidden{display:none!important}.search-page .status:empty{display:none!important}.search-page{margin-top:18px}.search-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.search-main{display:flex;gap:10px;align-items:center}.search-main input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:16px;outline:0}.search-main input:focus{border-color:#A5B4FC;box-shadow:0 0 0 4px var(--light)}.search-main button{min-height:52px;border:0;border-radius:14px;padding:0 20px;background:var(--indigo);color:#fff;font-weight:900;white-space:nowrap;cursor:pointer}.search-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}.search-summary strong{color:var(--navy)}.search-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.search-tab{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 13px;font-weight:900;cursor:pointer}.search-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}.result-section{margin-top:24px}.result-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.result-count{color:var(--muted);font-size:12px}.result-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.result-row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);text-decoration:none}.result-row:last-child{border-bottom:0}.result-row:hover{background:#FCFCFF}.result-type{display:inline-flex;justify-content:center;align-items:center;width:78px;min-height:28px;border-radius:999px;font-size:11px;font-weight:900}.result-type.singer{background:#DCFCE7;color:#15803D}.result-type.song{background:#EDE9FE;color:#5B21B6}.result-type.event{background:#FCE7F3;color:#BE185D}.result-type.venue{background:#E0F2FE;color:#0369A1}.result-title{font-weight:900;line-height:1.45}.alias-match{display:inline-flex;align-items:center;margin-left:8px;padding:4px 8px;border-radius:999px;background:#F0EDFF;color:var(--indigo);font-size:10px;font-weight:900;vertical-align:middle}.result-meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:4px;color:var(--muted);font-size:12px}.result-arrow{color:var(--indigo);font-size:22px;font-weight:900}.highlight{background:#FFF3C4;color:#8A5A00;border-radius:4px;padding:0 2px}.empty-state{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 20px;text-align:center;box-shadow:var(--shadow)}.empty-state strong{display:block;margin-bottom:5px;font-size:18px}.empty-state p{margin:0;color:var(--muted)}.suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.suggestions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.loading{display:inline-flex;gap:5px;margin-left:8px}.loading i{width:7px;height:7px;border-radius:50%;background:var(--indigo);animation:searchDot 1s infinite alternate}.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}@keyframes searchDot{to{opacity:.25;transform:translateY(-3px)}}@media(max-width:640px){.search-main{display:grid;grid-template-columns:1fr}.search-main button{width:100%}.result-row{grid-template-columns:72px minmax(0,1fr) auto;gap:10px;padding:14px 12px}.result-type{width:72px}.alias-match{display:flex;width:max-content;margin:5px 0 0}}
</style>

<body>
<div id="siteHeader"></div>
<main>
<div class="crumb"><a href="index.html">ホーム</a> › 検索結果</div>
<section class="hero"><span class="badge">UNIVERSAL SEARCH</span><h1>検索結果</h1><p>歌唱名義・曲・イベント・会場を横断して、μ'sの歴史を探します。</p><div class="muse-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section>
<section class="search-page">
<div class="search-panel">
<div class="search-main"><input id="searchInput" placeholder="μ'sの歴史を検索" autocomplete="off"><button id="searchButton" type="button">検索する</button></div>
<div class="search-summary"><div id="summaryText">検索語を入力してください。</div><div id="summaryCount"></div></div>
<div class="search-tabs" id="tabs">
<button class="search-tab active" data-tab="all">すべて</button>
<button class="search-tab" data-tab="singers">歌唱名義</button>
<button class="search-tab" data-tab="songs">曲</button>
<button class="search-tab" data-tab="events">イベント</button>
<button class="search-tab" data-tab="venues">会場</button>
</div></div>
<div id="status" class="status hidden"></div><div id="resultsArea"></div>
</section></main><div id="siteFooter"></div>
<script type="module">
import { renderCommon } from "./assets/js/common.js?v=4.8.0";
import { apiGet, escapeHtml, formatDate } from "./assets/js/api.js?v=2.7.0";
import { buildSingerUrl } from "./assets/js/singer-links.js?v=4.8.0";
renderCommon("");
const esc = escapeHtml;
const fmt = formatDate;
const params=new URLSearchParams(location.search),initialQuery=params.get("q")||"",searchInput=document.getElementById("searchInput"),searchButton=document.getElementById("searchButton"),summaryText=document.getElementById("summaryText"),summaryCount=document.getElementById("summaryCount"),status=document.getElementById("status"),resultsArea=document.getElementById("resultsArea");let activeTab="all",latestData=null;searchInput.value=initialQuery;
const normalize=v=>String(v||"").normalize("NFKC").toLowerCase().replace(/[’'`´]/g,"").replace(/[μµ]/g,"μ").replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s　・･／/～〜\-—_:：!！?？,.，。()（）【】［］「」『』"“”♡♥♪]+/g,"");
function highlight(value,query){const text=String(value||""),nt=normalize(text),nq=normalize(query);if(!nq)return esc(text);const i=nt.indexOf(nq);if(i<0)return esc(text);return `${esc(text.slice(0,i))}<span class="highlight">${esc(text.slice(i,i+query.length))}</span>${esc(text.slice(i+query.length))}`}
function aliasBadge(x){return x.matchAlias?`<span class="alias-match">検索別名「${esc(x.matchAlias)}」に一致</span>`:""}
function setLoading(m){status.classList.remove("hidden","error");status.innerHTML=`${esc(m)}<span class="loading"><i></i><i></i><i></i></span>`}function setError(m){status.classList.remove("hidden");status.classList.add("error");status.textContent=m}function clearStatus(){status.classList.add("hidden");status.classList.remove("error");status.textContent=""}
function singerRow(x,q){const title=x.displayName||x.singerName||"歌唱名義未設定",meta=[x.performanceCount!=null?`歌唱記録 ${Number(x.performanceCount).toLocaleString("ja-JP")}件`:"",x.songCount!=null?`曲 ${Number(x.songCount).toLocaleString("ja-JP")}曲`:"",x.eventCount!=null?`イベント ${Number(x.eventCount).toLocaleString("ja-JP")}件`:""].filter(Boolean),href=buildSingerUrl(x);return `<a class="result-row" href="${href}"><span class="result-type singer">歌唱名義</span><span><span class="result-title">${highlight(title,q)}${aliasBadge(x)}</span><span class="result-meta">${meta.map(v=>`<span>${esc(v)}</span>`).join("")}</span></span><span class="result-arrow">›</span></a>`}
function songRow(x,q){const title=x.displayName||x.songName||"曲名未設定",meta=[x.version,x.recordingCd?`収録CD：${x.recordingCd}`:"",x.releaseDate?`発売日：${fmt(x.releaseDate)}`:""].filter(Boolean);return `<a class="result-row" href="song.html?id=${encodeURIComponent(x.songId)}"><span class="result-type song">曲</span><span><span class="result-title">${highlight(title,q)}${aliasBadge(x)}</span><span class="result-meta">${meta.map(v=>`<span>${highlight(v,q)}</span>`).join("")}</span></span><span class="result-arrow">›</span></a>`}
function eventRow(x,q){const meta=[x.date?fmt(x.date):"",x.category,x.eventType,x.day,x.performance].filter(Boolean);return `<a class="result-row" href="event.html?id=${encodeURIComponent(x.eventId)}"><span class="result-type event">イベント</span><span><span class="result-title">${highlight(x.eventName||"イベント名未設定",q)}${aliasBadge(x)}</span><span class="result-meta">${meta.map(v=>`<span>${highlight(v,q)}</span>`).join("")}</span></span><span class="result-arrow">›</span></a>`}
function venueRow(x,q){const meta=[x.prefectureCity,x.region,x.country,x.capacity?`キャパ ${Number(x.capacity).toLocaleString("ja-JP")}人`:""].filter(Boolean);return `<a class="result-row" href="venue.html?id=${encodeURIComponent(x.venueId)}"><span class="result-type venue">会場</span><span><span class="result-title">${highlight(x.venueName||"会場名未設定",q)}${aliasBadge(x)}</span><span class="result-meta">${meta.map(v=>`<span>${highlight(v,q)}</span>`).join("")}</span></span><span class="result-arrow">›</span></a>`}
function section(title,kicker,count,rows){if(!rows)return"";return `<section class="result-section"><div class="result-head"><div><p class="kicker">${kicker}</p><h2>${title}</h2></div><div class="result-count">${count}件</div></div><div class="result-card">${rows}</div></section>`}
function renderResults(){if(!latestData){resultsArea.innerHTML="";return}const q=searchInput.value.trim()||latestData.query||"",g=latestData.results||{},c=latestData.counts||{},sir=(g.singers||[]).map(x=>singerRow(x,q)).join(""),sr=(g.songs||[]).map(x=>songRow(x,q)).join(""),er=(g.events||[]).map(x=>eventRow(x,q)).join(""),vr=(g.venues||[]).map(x=>venueRow(x,q)).join("");let html="";if(activeTab==="all"||activeTab==="singers")html+=section("歌唱名義","SINGER NAMES",c.singers||0,sir);if(activeTab==="all"||activeTab==="songs")html+=section("曲","SONGS",c.songs||0,sr);if(activeTab==="all"||activeTab==="events")html+=section("イベント","EVENTS",c.events||0,er);if(activeTab==="all"||activeTab==="venues")html+=section("会場","VENUES",c.venues||0,vr);if(!html)html=`<section class="result-section"><div class="empty-state"><strong>候補が見つかりませんでした</strong><p>別の言葉や、より短い語句でお試しください。</p><div class="suggestions"><button type="button" data-query="スノハレ">スノハレ</button><button type="button" data-query="えみつん">えみつん</button><button type="button" data-query="横浜">横浜</button></div></div></section>`;resultsArea.innerHTML=html;document.querySelectorAll("[data-query]").forEach(b=>b.onclick=()=>{searchInput.value=b.dataset.query;runSearch()})}
async function runSearch(){const q=searchInput.value.trim();if(!q){latestData=null;summaryText.textContent="検索語を入力してください。";summaryCount.textContent="";resultsArea.innerHTML="";clearStatus();return}const u=new URL(location.href);u.searchParams.set("q",q);history.replaceState(null,"",u);setLoading("検索しています");try{const r=await apiGet("search",{q});latestData=r.data;summaryText.innerHTML=`「<strong>${esc(q)}</strong>」の検索結果`;summaryCount.textContent=`${latestData.totalCount||0}件`;clearStatus();renderResults()}catch(e){console.error(e);latestData=null;resultsArea.innerHTML="";summaryText.textContent="検索結果を取得できませんでした。";summaryCount.textContent="";setError(e.message||"検索中にエラーが発生しました。")}}
document.querySelectorAll(".search-tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".search-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeTab=b.dataset.tab;renderResults()});searchButton.onclick=runSearch;searchInput.onkeydown=e=>{if(e.key==="Enter")runSearch()};if(initialQuery)runSearch();
</script></body></html>
