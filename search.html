<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    検索結果｜μ's Song Database
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css?v=2.4.0"
  >

  <style>
    .search-page {
      margin-top: 18px;
    }

    .search-panel {
      position: relative;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .search-main {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr) auto;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
    }

    .search-main input {
      width: 100%;
      min-height: 54px;
      padding: 0 44px 0 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: 0;
      font-size: 16px;
    }

    .search-main input:focus {
      border-color: #a5b4fc;
      box-shadow:
        0 0 0 4px
        var(--light);
    }

    /* Chrome・Edge・Safari標準の検索クリアボタンを非表示 */
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-decoration {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }

    input[type="search"]::-ms-clear,
    input[type="search"]::-ms-reveal {
      display: none;
      width: 0;
      height: 0;
    }

    .search-clear {
      position: absolute;
      top: 50%;
      right: 12px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #f1f3f7;
      color: var(--muted);
      cursor: pointer;
      transform:
        translateY(-50%);
    }

    .search-main-submit {
      min-height: 54px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: var(--indigo);
      color: #fff;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    .live-hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .search-summary {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .search-summary strong {
      color: var(--navy);
    }

    .search-tabs {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-tab {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
    }

    .search-tab.active {
      border-color: var(--indigo);
      background: var(--indigo);
      color: #fff;
    }

    .search-tab span {
      margin-left: 4px;
      opacity: .65;
      font-size: 10px;
    }

    .result-section {
      margin-top: 24px;
    }

    .result-head {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
    }

    .result-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .result-row {
      display: grid;
      grid-template-columns:
        78px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .result-row:hover,
    .result-row.keyboard-active {
      background: #fcfcff;
    }

    .result-type {
      width: 78px;
      min-height: 28px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .result-type.song {
      background: #ede9fe;
      color: #5b21b6;
    }

    .result-type.event {
      background: #fce7f3;
      color: #be185d;
    }

    .result-type.venue {
      background: #e0f2fe;
      color: #0369a1;
    }

    .result-title {
      font-weight: 900;
      line-height: 1.45;
    }

    .result-meta {
      margin-top: 4px;
      display: flex;
      gap: 5px 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .result-arrow {
      color: var(--indigo);
      font-size: 22px;
      font-weight: 900;
    }

    .highlight {
      padding: 0 2px;
      border-radius: 4px;
      background: #fff3c4;
      color: #8a5a00;
    }

    .empty-state {
      padding: 34px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      font-size: 18px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
    }

    .suggestions {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .suggestions button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .loading {
      display: inline-flex;
      gap: 5px;
      margin-left: 8px;
    }

    .loading i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--indigo);
      animation:
        searchDot
        1s infinite alternate;
    }

    .loading i:nth-child(2) {
      animation-delay: .15s;
    }

    .loading i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes searchDot {
      to {
        opacity: .25;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 640px) {
      .search-main {
        grid-template-columns: 1fr;
      }

      .search-main-submit {
        width: 100%;
      }

      .result-row {
        grid-template-columns:
          66px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 14px 12px;
      }

      .result-type {
        width: 66px;
      }

      .search-summary {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  
    .result-type.singer {
      background: #dcfce7;
      color: #15803d;
    }

    .match-reason {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #f2f0ff;
      color: var(--indigo);
      font-size: 10px;
      font-weight: 800;
    }

    .singer-result-note {
      color: var(--muted);
      font-size: 12px;
    }

</style>
</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">
      ホーム › 検索結果
    </div>

    <section class="hero">
      <span class="badge">
        UNIVERSAL SEARCH
      </span>

      <h1>検索結果</h1>

      <p>
        曲・イベント・会場を横断して、
        μ'sの歴史を探します。
      </p>

      <div class="muse-line">
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
      </div>
    </section>

    <section class="search-page">
      <div class="search-panel">
        <div class="search-main">
          <div class="search-input-wrap">
            <input
              id="searchInput"
              type="search"
              placeholder="2文字以上入力すると自動検索"
              autocomplete="off"
              autofocus
            >

            <button
              class="search-clear"
              id="clearButton"
              type="button"
              aria-label="検索語を消去"
              hidden
            >
              ×
            </button>
          </div>

          <button
            class="search-main-submit"
            id="searchButton"
            type="button"
          >
            検索する
          </button>
        </div>

        <div class="live-hint">
          入力から約0.3秒後に検索します。
          Enterキーでも検索できます。
        </div>

        <div class="search-summary">
          <div id="summaryText">
            検索語を入力してください。
          </div>

          <div id="summaryCount"></div>
        </div>

        <div
          class="search-tabs"
          id="tabs"
        >
          <button
            class="search-tab active"
            data-tab="all"
            type="button"
          >
            すべて
            <span id="allTabCount">0</span>
          </button>

          <button
            class="search-tab"
            data-tab="singers"
            type="button"
          >
            歌唱者
            <span id="singerTabCount">0</span>
          </button>

          <button
            class="search-tab"
            data-tab="songs"
            type="button"
          >
            曲
            <span id="songTabCount">0</span>
          </button>

          <button
            class="search-tab"
            data-tab="events"
            type="button"
          >
            イベント
            <span id="eventTabCount">0</span>
          </button>

          <button
            class="search-tab"
            data-tab="venues"
            type="button"
          >
            会場
            <span id="venueTabCount">0</span>
          </button>
        </div>
      </div>

      <div
        id="status"
        class="status"
        hidden
      ></div>

      <div id="resultsArea"></div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    type="module"
    src="assets/js/search.js?v=2.4.0"
  ></script>
</body>
</html>
