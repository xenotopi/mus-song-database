  <link rel="stylesheet" href="assets/css/style.css?v=4.6.0">

  <style>
    .singer-page{max-width:1120px;margin:0 auto;padding:26px 18px 60px}
    .singer-hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,#18223d,#5146e5);color:#fff;box-shadow:var(--shadow)}
    .singer-kicker{margin:0 0 10px;font-size:14px;font-weight:900;letter-spacing:.1em;opacity:.8}
    .singer-name{margin:0;font-size:clamp(30px,6vw,48px);line-height:1.2}
    .singer-sub{margin:10px 0 0;color:#e9eaff;font-size: 14px;font-weight:700}
    .singer-summary{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .singer-summary-card{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:var(--shadow)}
    .singer-summary-value{color:var(--indigo);font-size:26px;font-weight:900;line-height:1}
    .singer-summary-label{margin-top:8px;color:var(--muted);font-size: 14px;font-weight:800}
    .singer-section{margin-top:30px}
    .singer-section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}
    .singer-section-head h2{margin:3px 0 0;color:var(--navy);font-size:24px}
    .singer-section-kicker{margin:0;color:var(--indigo);font-size:14px;font-weight:900;letter-spacing:.09em}
    .singer-song-list,.singer-history-list{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .singer-song-row{display:grid;gap:14px;padding:16px 18px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
    .singer-song-row:first-child{border-top:0}
    .singer-song-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
    .singer-song-row strong{color:var(--navy);font-size:14px}
    .singer-song-meta{margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:700}
    .singer-song-count{color:var(--indigo);font-size:20px;font-weight:900;white-space:nowrap}
    .singer-status{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
    @media(max-width:820px){.singer-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.singer-summary-card:first-child{grid-column:1/-1}}
    @media(max-width:620px){.singer-page{padding:18px 12px 44px}.singer-hero{padding:22px 18px}.singer-song-row{padding:14px}}
  
    /* v4.6 Singer Detail */
    .singer-hero-v46{
      position:relative;overflow:hidden;padding-bottom:38px;
      background:
        radial-gradient(circle at 88% 8%,rgba(126,111,255,.20),transparent 27%),
        linear-gradient(135deg,#18213d 0%,#293263 54%,#5147c9 100%);
      box-shadow:0 18px 46px rgba(30,34,76,.12)
    }
    .singer-color-line{
      position:absolute;left:28px;right:28px;bottom:16px;height:4px;
      display:flex;gap:5px
    }
    .singer-color-line span{flex:1 1 0;border-radius:999px}
    .singer-summary{margin-top:18px}
    .singer-summary-card{border-color:#dfdced;box-shadow:0 8px 24px rgba(38,39,77,.055)}
    .singer-summary-card:first-child{
      background:linear-gradient(135deg,#f0f1ff,#f7f5ff);
      border-color:#d7d3ff
    }
    .singer-analysis-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
    .singer-analysis-card{
      padding:20px;border:1px solid #dfdced;border-radius:20px;background:#fff;
      box-shadow:0 8px 24px rgba(38,39,77,.055)
    }
    .singer-analysis-card h2{margin:4px 0 0;color:var(--navy);font-size:20px}
    .singer-year-chart{margin-top:18px;display:grid;gap:9px}
    .singer-year-row{display:grid;grid-template-columns:52px minmax(0,1fr) 56px;gap:10px;align-items:center}
    .singer-year-label{color:var(--muted);font-size:14px;font-weight:900}
    .singer-year-track{height:12px;overflow:hidden;border-radius:999px;background:#eceef5}
    .singer-year-bar{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4f46e5,#8b5cf6)}
    .singer-year-value{color:var(--navy);font-size:14px;font-weight:900;text-align:right}
    .singer-song-row{grid-template-columns:38px minmax(0,1fr) auto}
    .singer-song-rank{
      width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
      background:var(--indigo-soft);color:var(--indigo);font-weight:900;font-size:14px
    }
    .singer-history-controls{
      margin-bottom:14px;padding:16px;border:1px solid #dedaf5;border-radius:18px;background:#faf9ff
    }
    .singer-filter-label{margin:0 0 9px;color:var(--muted);font-size:14px;font-weight:900;letter-spacing:.07em}
    .singer-year-filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
    .singer-year-pill{
      flex:0 0 auto;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;
      color:var(--navy);font-size:14px;font-weight:900;cursor:pointer
    }
    .singer-year-pill.active{border-color:var(--indigo);background:var(--indigo);color:#fff}
    .singer-visible-count{margin-top:10px;color:var(--muted);font-size:14px;font-weight:800;text-align:right}
    .singer-history-order-note{margin:8px 0 0;color:#4b5563;font-size:14px;font-weight:600}
    .singer-event-card{border-top:1px solid var(--line)}
    .singer-event-card:first-child{border-top:0}
    .singer-event-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:17px 18px}
    .singer-event-date{color:var(--indigo);font-size:14px;font-weight:900}
    .singer-event-title{margin:5px 0 0;color:var(--navy);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
    .singer-event-title a{color:inherit;text-decoration:none}
    .singer-event-title a:hover,.singer-event-title a:focus-visible{color:var(--indigo);text-decoration:underline}
    .singer-event-meta{margin-top:6px;display:flex;gap:6px 12px;flex-wrap:wrap;color:#4b5563;font-size:14px;font-weight:700}
    .singer-event-toggle{display:flex;gap:8px;align-items:center;justify-content:center;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--indigo);font:inherit;font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
    .singer-event-toggle:hover,.singer-event-toggle:focus-visible{border-color:var(--indigo);background:var(--indigo-soft)}
    .singer-event-chevron{display:inline-block;transition:transform .18s ease}
    .singer-event-toggle[aria-expanded="true"] .singer-event-chevron{transform:rotate(180deg)}
    .singer-event-songs{padding:0 18px 16px;border-top:1px solid var(--line);background:#fafaff}
    .singer-event-song-row{padding:12px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700;overflow-wrap:anywhere}
    .singer-event-song-row:first-child{border-top:0}
    .singer-event-song-row a{color:var(--navy);text-decoration:none}
    .singer-event-song-row a:hover,.singer-event-song-row a:focus-visible{color:var(--indigo);text-decoration:underline}
    .singer-history-empty{padding:16px 18px;color:var(--muted);font-size:14px}
    .singer-more-wrap{margin-top:14px;text-align:center}
    .singer-more-button{
      min-width:220px;min-height:44px;padding:0 18px;border:1px solid var(--indigo);
      border-radius:999px;background:#fff;color:var(--indigo);font-weight:900;cursor:pointer
    }
    .singer-more-button:hover{background:var(--indigo);color:#fff}
    @media(max-width:620px){
      .singer-color-line{left:18px;right:18px}
      .singer-analysis-card{padding:16px}
      .singer-song-row{grid-template-columns:34px minmax(0,1fr) auto}
      .singer-year-row{grid-template-columns:44px minmax(0,1fr) 50px}
      .singer-event-head{gap:10px;padding:15px 14px}
      .singer-event-toggle{padding:8px 10px}
      .singer-event-songs{padding:0 14px 14px}
    }

  
    .breadcrumb a{
      color:inherit;
      text-decoration:none;
    }
    .breadcrumb a:hover{
      color:var(--indigo);
      text-decoration:underline;
    }
  </style>

  <script src="assets/js/seo-v351.js?v=4.8.0&amp;cache=domain-c" defer></script>
</head>

<body>
  <div id="siteHeader"></div>

  <main class="singer-page">
    <div class="breadcrumb"><a href="index.html">ホーム</a> › 歌唱名義詳細</div>

    <section class="singer-hero singer-hero-v46">
      <p class="singer-kicker">SINGING NAME DETAIL</p>
      <h1 class="singer-name" id="singerName">読み込み中...</h1>
      <p class="singer-sub">この歌唱名義が残してきた歌唱履歴を確認できます。</p>
      <div class="singer-color-line" id="singerColorLine" aria-hidden="true"></div>
    </section>

    <div class="singer-status" id="status">データを読み込んでいます...</div>
    <button id="retryButton" type="button" hidden>再試行</button>

    <section class="singer-summary" id="summary" hidden>
      <article class="singer-summary-card"><div class="singer-summary-value" id="performanceCount">0</div><div class="singer-summary-label">歌唱記録数</div></article>
      <article class="singer-summary-card"><div class="singer-summary-value" id="songCount">0</div><div class="singer-summary-label">歌唱曲数</div></article>
      <article class="singer-summary-card"><div class="singer-summary-value" id="eventCount">0</div><div class="singer-summary-label">出演イベント数</div></article>
    </section>


    <section class="singer-section singer-analysis-section" id="analysisSection" hidden>
      <div class="singer-section-head">
        <div>
          <p class="singer-section-kicker">SINGING NAME ANALYSIS</p>
          <h2>歌唱データ分析</h2>
        </div>
      </div>

      <div class="singer-analysis-grid">
        <article class="singer-analysis-card">
          <p class="singer-section-kicker">YEARLY PERFORMANCES</p>
          <h2>年別歌唱推移</h2>
          <div class="singer-year-chart" id="yearChart"></div>
        </article>

      </div>
    </section>

    <section class="singer-section" id="historySection" hidden>
      <div class="singer-section-head">
        <div>
          <p class="singer-section-kicker">HISTORY</p>
          <h2>歌唱履歴</h2>
        </div>
        <span id="historyCount"></span>
      </div>

      <div class="singer-history-controls">
        <div class="singer-year-filter-wrap">
          <p class="singer-filter-label">開催年で絞り込む</p>
          <div class="singer-year-filters" id="yearFilters"></div>
        </div>

        <div class="singer-visible-count" id="visibleHistoryCount"></div>
        <p class="singer-history-order-note">曲の掲載順は実際の歌唱順ではありません。</p>
      </div>

      <div class="singer-history-list" id="historyList"></div>
      <div class="singer-more-wrap">
        <button class="singer-more-button" id="historyMoreButton" type="button" hidden>もっと見る</button>
      </div>
    </section>

    <section class="singer-section" id="songsSection" hidden>
      <div class="singer-section-head">
        <div>
          <p class="singer-section-kicker">SONGS</p>
          <h2>歌唱曲一覧</h2>
        </div>
        <span id="songsCount"></span>
      </div>
      <div class="singer-song-list" id="songsList"></div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="assets/js/singer-v460.js?v=4.9.1&amp;cache=revision-nonblocking"></script>
  <script type="module">
    import {
      setupDetailContext
    } from "./assets/js/detail-context.js?v=4.6.1";

    setupDetailContext({
      typeLabel: "歌唱名義",
      titleSelector: "#singerName",
      heroSelector: ".singer-hero"
    });
  </script>

</body>
