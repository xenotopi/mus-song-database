<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    曲詳細｜μ's Song Database
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css?v=2.6.1"
  >

  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 92px;
    }

    .detail-local-nav {
      position: sticky;
      z-index: 50;
      top: 68px;
      margin-top: 16px;
      padding: 9px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 10px 28px rgba(23,32,51,.08);
      backdrop-filter: blur(10px);
    }

    .detail-local-nav a {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }

    .detail-local-nav a:hover {
      background: var(--indigo-soft);
      color: var(--indigo);
    }

    .discovery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .discovery-card {
      min-height: 132px;
      padding: 17px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease;
    }

    .discovery-card:hover {
      border-color: #bbb6f5;
      transform: translateY(-2px);
    }

    .discovery-label {
      color: var(--indigo);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .discovery-title {
      margin-top: 12px;
      color: var(--navy);
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
    }

    .discovery-meta {
      margin-top: auto;
      padding-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .list-controls {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .filter-pill.active {
      border-color: var(--indigo);
      background: var(--indigo);
      color: #fff;
    }

    .show-more-wrap {
      margin-top: 15px;
      text-align: center;
    }

    .show-more-button {
      min-width: 220px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--indigo);
      border-radius: 999px;
      background: #fff;
      color: var(--indigo);
      font-weight: 900;
      cursor: pointer;
    }

    .show-more-button:hover {
      background: var(--indigo);
      color: #fff;
    }

    @media (max-width: 760px) {
      .detail-local-nav {
        top: 60px;
      }

      .discovery-grid {
        grid-template-columns: 1fr;
      }
    }
  
.discover-panel {
  margin-top: 24px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f7f5ff
    );
  box-shadow: var(--shadow);
}

.discover-cards {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 12px;
}

.discover-item {
  min-height: 136px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
  text-decoration: none;
}

.discover-item:hover {
  border-color: #bdb7f5;
  transform: translateY(-1px);
}

.discover-item-label {
  color: var(--indigo);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
}

.discover-item-title {
  margin-top: 11px;
  color: var(--navy);
  font-size: 16px;
  font-weight: 900;
  line-height: 1.45;
}

.discover-item-meta {
  margin-top: auto;
  padding-top: 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.insight-list {
  display: grid;
  gap: 9px;
}

.insight-row {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  text-decoration: none;
}

.insight-row:hover {
  border-color: #bdb7f5;
  background: #fcfbff;
}

.insight-title {
  color: var(--navy);
  font-weight: 900;
}

.insight-meta {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.insight-value {
  color: var(--indigo);
  font-weight: 900;
  white-space: nowrap;
}

.trend-chart {
  display: grid;
  gap: 9px;
}

.trend-row {
  display: grid;
  grid-template-columns:
    52px minmax(0, 1fr) 62px;
  gap: 10px;
  align-items: center;
}

.trend-year {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.trend-track {
  height: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: #eceef5;
}

.trend-bar {
  height: 100%;
  border-radius: inherit;
  background:
    linear-gradient(
      90deg,
      #4f46e5,
      #8b5cf6
    );
}

.trend-value {
  color: var(--navy);
  font-size: 11px;
  font-weight: 900;
  text-align: right;
}

@media (max-width: 760px) {
  .discover-cards {
    grid-template-columns: 1fr;
  }
}



    .song-switcher {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0,1fr) 280px minmax(0,1fr);
      gap: 12px;
    }

    .song-switch-link,
    .song-switch-select-wrap {
      min-height: 82px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .song-switch-link {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-decoration: none;
    }

    .song-switch-link.next {
      text-align: right;
      align-items: flex-end;
    }

    .song-switch-link.disabled {
      opacity: .48;
      pointer-events: none;
    }

    .song-switch-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .song-switch-title {
      margin-top: 5px;
      color: var(--navy);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.4;
    }

    .song-switch-select-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .song-switch-select-wrap label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .song-switch-select {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .song-switcher {
        grid-template-columns: 1fr 1fr;
      }

      .song-switch-select-wrap {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .song-switch-link {
        min-height: 72px;
      }
    }

</style>

</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">
      ホーム › 曲詳細
    </div>

    <section class="hero">
      <span class="badge">
        曲
      </span>

      <h1 id="songName">
        読み込み中…
      </h1>

      <p id="heroMeta">
        JSONPでAPIへ接続しています。
      </p>

      <div class="muse-line">
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
      </div>
    </section>

    <section
      class="song-switcher"
      id="songSwitcher"
      hidden
      aria-label="曲の切り替え"
    >
      <a
        class="song-switch-link"
        id="previousSongButton"
        href="#"
      >
        <span class="song-switch-label">
          ← 前の曲
        </span>

        <span
          class="song-switch-title"
          id="previousSongTitle"
        ></span>
      </a>

      <div class="song-switch-select-wrap">
        <label for="songPicker">
          曲を選ぶ
        </label>

        <select
          class="song-switch-select"
          id="songPicker"
        ></select>
      </div>

      <a
        class="song-switch-link next"
        id="nextSongButton"
        href="#"
      >
        <span class="song-switch-label">
          次の曲 →
        </span>

        <span
          class="song-switch-title"
          id="nextSongTitle"
        ></span>
      </a>
    </section>

    <nav
      class="detail-local-nav"
      id="detailLocalNav"
      hidden
      aria-label="ページ内ナビゲーション"
    >
      <a href="#mainContent">基本情報</a>
      <a href="#discoverySection">この曲を巡る</a>
      <a href="#songInsightsSection">関連データ</a>
      <a href="#historySection">歌唱履歴</a>
    </nav>

    <div
      class="status"
      id="status"
    >
      曲データを読み込んでいます
    </div>

    <div class="retry-wrap">
      <button
        class="retry-button"
        id="retryButton"
        type="button"
        hidden
      >
        再試行
      </button>
    </div>

    <section
      class="grid"
      id="mainContent"
      hidden
    >
      <article class="card">
        <p class="kicker">
          SONG INFORMATION
        </p>

        <h2>基本情報</h2>

        <dl
          class="info"
          id="songInfo"
        ></dl>
      </article>

      <article class="card">
        <p class="kicker">
          PERFORMANCE SUMMARY
        </p>

        <h2>歌唱統計</h2>

        <div
          class="stats"
          id="songStats"
        ></div>

        <dl
          class="info"
          id="songDates"
          style="margin-top:14px"
        ></dl>
      </article>
    </section>

    <section
      class="section"
      id="discoverySection"
      hidden
    >
      <div class="section-head">
        <div>
          <p class="kicker">EXPLORE THIS SONG</p>
          <h2>この曲を巡る</h2>
        </div>
      </div>

      <div
        class="discovery-grid"
        id="songDiscovery"
      ></div>
    </section>

    <section
      class="section"
      id="songInsightsSection"
      hidden
    >
      <div class="section-head">
        <div>
          <p class="kicker">RELATED DATA</p>
          <h2>関連データ</h2>
        </div>
      </div>

      <div
        class="grid"
      >
        <article class="card">
          <p class="kicker">CO-PERFORMED SONGS</p>
          <h2>一緒に歌われた曲</h2>
          <div
            class="insight-list"
            id="coPerformedSongs"
          ></div>
        </article>

        <article class="card">
          <p class="kicker">TOP VENUES</p>
          <h2>よく歌われた会場</h2>
          <div
            class="insight-list"
            id="songTopVenues"
          ></div>
        </article>
      </div>
    </section>

    <section
      class="section"
      id="historySection"
      hidden
    >
      <div class="section-head">
        <div>
          <p class="kicker">
            PERFORMANCE HISTORY
          </p>

          <h2>歌唱履歴</h2>
        </div>

        <div
          class="detail-note"
          id="historyCount"
        ></div>
      </div>

      <div class="list-controls">
        <div
          class="filter-pills"
          id="historyFilters"
        >
          <button class="filter-pill active" type="button" data-filter="all">
            すべて
          </button>

          <button class="filter-pill" type="button" data-filter="公式">
            公式
          </button>

          <button class="filter-pill" type="button" data-filter="ソロ">
            ソロ
          </button>
        </div>

        <div
          class="detail-note"
          id="visibleHistoryCount"
        ></div>
      </div>

      <article
        class="card song-list"
        id="historyList"
      ></article>

      <div class="show-more-wrap">
        <button
          class="show-more-button"
          id="historyMoreButton"
          type="button"
          hidden
        >
          もっと見る
        </button>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    type="module"
    src="assets/js/song.js?v=2.6.3"
  ></script>
</body>
</html>
