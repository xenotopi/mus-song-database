<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    曲詳細｜μ's Song Database
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css?v=2.0.2"
  >
</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">
      ホーム › 曲詳細
    </div>

    <section class="hero">
      <span class="badge">
        曲
      </span>

      <h1 id="songName">
        読み込み中…
      </h1>

      <p id="heroMeta">
        JSONPでAPIへ接続しています。
      </p>

      <div class="muse-line">
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
      </div>
    </section>

    <div
      class="status"
      id="status"
    >
      曲データを読み込んでいます
    </div>

    <div class="retry-wrap">
      <button
        class="retry-button"
        id="retryButton"
        type="button"
        hidden
      >
        再試行
      </button>
    </div>

    <section
      class="grid"
      id="mainContent"
      hidden
    >
      <article class="card">
        <p class="kicker">
          SONG INFORMATION
        </p>

        <h2>基本情報</h2>

        <dl
          class="info"
          id="songInfo"
        ></dl>
      </article>

      <article class="card">
        <p class="kicker">
          PERFORMANCE SUMMARY
        </p>

        <h2>歌唱統計</h2>

        <div
          class="stats"
          id="songStats"
        ></div>

        <dl
          class="info"
          id="songDates"
          style="margin-top:14px"
        ></dl>
      </article>
    </section>

    <section
      class="section"
      id="historySection"
      hidden
    >
      <div class="section-head">
        <div>
          <p class="kicker">
            PERFORMANCE HISTORY
          </p>

          <h2>歌唱履歴</h2>
        </div>

        <div
          class="detail-note"
          id="historyCount"
        ></div>
      </div>

      <article
        class="card song-list"
        id="historyList"
      ></article>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    type="module"
    src="assets/js/song.js?v=2.0.2"
  ></script>
</body>
</html>
