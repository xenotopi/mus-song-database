<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲詳細</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main><div class="crumb">ホーム › 曲詳細</div><section class="hero"><h1 id="pageTitle">読み込み中…</h1><p id="pageMeta">API接続中</p><div class="muse-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><div class="status" id="status">読み込み中…</div><section class="grid" id="content" hidden><article class="card"><h2>基本情報</h2><dl class="info" id="info"></dl></article><article class="card"><h2>歌唱統計</h2><div class="stats" id="stats"></div></article></section><section class="section" id="historySection" hidden><h2>歌唱履歴</h2><div class="card" style="padding:0;overflow:hidden" id="history"></div></section></main><div id="siteFooter"></div><script type="module">import{common}from"./assets/js/common.js";import{apiGet,esc,fmt}from"./assets/js/api.js";common("song");const id=new URLSearchParams(location.search).get("id")||"S003";const titleEl=document.getElementById("pageTitle"),metaEl=document.getElementById("pageMeta"),statusEl=document.getElementById("status"),contentEl=document.getElementById("content"),historySectionEl=document.getElementById("historySection");try{const r=await apiGet("song",{id}),s=r.data,t=s.statistics||{};titleEl.textContent=s.displayName||s.songName;metaEl.textContent=[s.media,s.category,fmt(s.releaseDate)].filter(Boolean).join("｜");info.innerHTML=[["曲ID",s.songId],["表示名",s.displayName],["バージョン",s.version],["収録CD",s.recordingCd],["発売日",fmt(s.releaseDate)],["メディア",s.media],["区分",s.category]].map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1]||"—")}</dd>`).join("");stats.innerHTML=[["歌唱イベント数",t.eventCount],["公式イベント",t.officialEventCount],["ソロイベント",t.soloEventCount],["歌唱記録数",t.performanceCount]].map(x=>`<div class="stat"><div class="value">${x[1]??0}</div><div class="label">${x[0]}</div></div>`).join("");history.innerHTML=(s.performances||[]).map(x=>`<a class="row" href="event.html?id=${encodeURIComponent(x.eventId)}"><span>${fmt(x.date)}</span><span><span class="title">${esc(x.eventName)}</span><span class="meta">${esc(x.singer)}</span></span><span>›</span></a>`).join("");statusEl.hidden=true;contentEl.hidden=false;historySectionEl.hidden=false}catch(e){statusEl.classList.add("error");statusEl.textContent=`曲データを取得できませんでした。${e.message}`;titleEl.textContent="曲データを表示できません"}</script></body></html>
