<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    統計｜μ's Song Database
  </title>

  <link
    rel="stylesheet"
    href="assets/css/style.css?v=2.6.1"
  >

  <style>
    .stat-controls {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-control {
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }

    .stat-control:hover {
      transform: translateY(-1px);
      border-color: #b9b4f4;
    }

    .stat-control.active {
      border-color: var(--indigo);
      background: var(--indigo);
      color: #fff;
    }

    .stat-summary {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-summary-card {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .stat-summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .stat-summary-value {
      margin-top: 7px;
      color: var(--indigo);
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
    }

    .stat-summary-note {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .stat-chart-card {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .stat-chart-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .stat-chart-guide {
      color: var(--muted);
      font-size: 11px;
    }

    .stat-chart {
      margin-top: 20px;
      display: grid;
      gap: 9px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 58px minmax(0,1fr) 78px;
      gap: 12px;
      align-items: center;
      min-height: 27px;
      padding: 3px 0;
      border-radius: 10px;
    }

    .stat-row.is-maximum {
      background: transparent;
    }

    .stat-year {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .stat-row.is-maximum .stat-year {
      color: var(--indigo);
    }

    .stat-track {
      position: relative;
      height: 18px;
      overflow: hidden;
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          90deg,
          #eceef5 0,
          #eceef5 calc(25% - 1px),
          #dfe2eb calc(25% - 1px),
          #dfe2eb 25%
        );
    }

    .stat-bar {
      display: block;
      height: 100%;
      min-width: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          #4f46e5,
          #8b5cf6
        );
      box-shadow: 0 3px 9px rgba(79,70,229,.25);
      transform-origin: left center;
      animation: statBarGrow .45s ease both;
    }

    .stat-row.is-maximum .stat-bar {
      background:
        linear-gradient(
          90deg,
          #4338ca,
          #ec4899
        );
    }

    .stat-value {
      color: var(--navy);
      font-size: 15px;
      font-weight: 900;
      text-align: right;
      letter-spacing: .01em;
    }

    .stat-row.is-maximum .stat-value {
      color: var(--indigo);
    }

    @keyframes statBarGrow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (max-width: 760px) {
      .stat-summary {
        grid-template-columns: 1fr;
      }

      .stat-chart-card {
        padding: 17px 14px;
      }

      .stat-row {
        grid-template-columns: 46px minmax(0,1fr) 72px;
        gap: 8px;
      }

      .stat-value {
        font-size: 14px;
      }

      .stat-chart-heading {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">
      ホーム › 統計
    </div>

    <section class="hero">
      <span class="badge">
        VISUALIZATION
      </span>

      <h1>年別データ</h1>

      <p>
        μ'sの歌唱履歴を年ごとに眺めます。
      </p>

      <div class="muse-line">
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
      </div>
    </section>

    <div
      class="status"
      id="status"
    >
      統計データを読み込んでいます…
    </div>

    <section
      id="statisticsContent"
      hidden
    >
      <div class="stat-controls">
        <button
          class="stat-control active"
          data-metric="performanceCount"
          type="button"
        >
          歌唱記録数
        </button>

        <button
          class="stat-control"
          data-metric="eventCount"
          type="button"
        >
          イベント数
        </button>

        <button
          class="stat-control"
          data-metric="uniqueSongCount"
          type="button"
        >
          歌唱曲数
        </button>

        <button
          class="stat-control"
          data-metric="venueCount"
          type="button"
        >
          利用会場数
        </button>
      </div>

      <div
        class="stat-summary"
        id="statSummary"
      ></div>

      <article class="stat-chart-card">
        <div class="stat-chart-heading">
          <div>
            <p class="kicker" id="chartKicker">
              PERFORMANCE RECORDS
            </p>

            <h2 id="chartTitle">
              年別歌唱記録数
            </h2>
          </div>

          <p class="stat-chart-guide">
            棒の長さは最大年を100%として比較しています
          </p>
        </div>

        <div
          class="stat-chart"
          id="statisticsChart"
        ></div>
      </article>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    type="module"
    src="assets/js/statistics.js?v=2.6.2"
  ></script>
</body>
</html>
