<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>統計｜μ's Song Database</title>

  <link
    rel="stylesheet"
    href="assets/css/style.css?v=2.6.1"
  >

  <style>
    .stat-controls {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-control,
    .chart-mode-button {
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
    }

    .stat-control.active,
    .chart-mode-button.active {
      border-color: var(--indigo);
      background: var(--indigo);
      color: #fff;
    }

    .stat-summary {
      margin-top: 18px;
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-summary-card,
    .stat-chart-card,
    .stat-comparison-card,
    .stat-table-card {
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .stat-summary-card {
      padding: 17px 18px;
      border-radius: 17px;
    }

    .stat-summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .stat-summary-value {
      margin-top: 7px;
      color: var(--indigo);
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
    }

    .stat-summary-note {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .stat-chart-card,
    .stat-comparison-card,
    .stat-table-card {
      margin-top: 18px;
      padding: 22px;
      border-radius: 20px;
    }

    .stat-chart-heading {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: end;
    }

    .chart-mode-list {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .stat-chart-guide {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .chart-container {
      position: relative;
      margin-top: 20px;
      height: 430px;
    }

    .comparison-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns:
        minmax(0, 1.4fr)
        minmax(280px, .6fr);
      gap: 18px;
      align-items: center;
    }

    .comparison-chart-container {
      position: relative;
      min-height: 340px;
    }

    .comparison-cards {
      display: grid;
      gap: 12px;
    }

    .comparison-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fafaff;
    }

    .comparison-card-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .comparison-card-value {
      margin-top: 6px;
      color: var(--indigo);
      font-size: 27px;
      font-weight: 900;
    }

    .comparison-card-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .stat-fallback {
      margin-top: 16px;
      overflow-x: auto;
    }

    .stat-fallback table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    .stat-fallback th,
    .stat-fallback td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      font-size: 12px;
    }

    .stat-fallback th:first-child,
    .stat-fallback td:first-child {
      text-align: left;
    }

    .stat-fallback th {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .chart-error {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid #f1c1cb;
      border-radius: 14px;
      background: #fff5f7;
      color: #9b2945;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .stat-summary {
        grid-template-columns: 1fr;
      }

      .stat-chart-card,
      .stat-comparison-card,
      .stat-table-card {
        padding: 17px 14px;
      }

      .stat-chart-heading {
        align-items: start;
        flex-direction: column;
      }

      .chart-container {
        height: 360px;
      }
    }
  </style>
</head>

<body>
  <div id="siteHeader"></div>

  <main>
    <div class="crumb">
      ホーム › 統計
    </div>

    <section class="hero">
      <span class="badge">
        VISUALIZATION
      </span>

      <h1>年別データ</h1>

      <p>
        μ'sの歌唱履歴を年ごとに比較します。
      </p>

      <div class="muse-line">
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
        <i></i><i></i><i></i>
      </div>
    </section>

    <div
      class="status"
      id="status"
    >
      統計データを読み込んでいます…
    </div>

    <section
      id="statisticsContent"
      hidden
    >
      <div class="stat-controls">
        <button
          class="stat-control active"
          data-metric="performanceCount"
          type="button"
        >
          歌唱記録数
        </button>

        <button
          class="stat-control"
          data-metric="eventCount"
          type="button"
        >
          イベント数
        </button>

        <button
          class="stat-control"
          data-metric="uniqueSongCount"
          type="button"
        >
          歌唱曲数
        </button>

        <button
          class="stat-control"
          data-metric="venueCount"
          type="button"
        >
          利用会場数
        </button>
      </div>

      <div
        class="stat-summary"
        id="statSummary"
      ></div>

      <article class="stat-chart-card">
        <div class="stat-chart-heading">
          <div>
            <p
              class="kicker"
              id="chartKicker"
            >
              PERFORMANCE RECORDS
            </p>

            <h2 id="chartTitle">
              年別の延べ歌唱記録数
            </h2>
          </div>

          <div class="chart-mode-list">
            <button
              class="chart-mode-button active"
              data-chart-mode="bar"
              type="button"
            >
              棒グラフ
            </button>

            <button
              class="chart-mode-button"
              data-chart-mode="line"
              type="button"
            >
              推移
            </button>
          </div>
        </div>

        <p
          class="stat-chart-guide"
          id="chartDescription"
        ></p>

        <div class="chart-container">
          <canvas
            id="statisticsChart"
            aria-label="年別統計グラフ"
          ></canvas>
        </div>

        <div
          class="chart-error"
          id="chartError"
          hidden
        ></div>
      </article>

      <article class="stat-comparison-card">
        <div class="stat-chart-heading">
          <div>
            <p class="kicker">
              OFFICIAL / SOLO
            </p>

            <h2 id="comparisonTitle">
              公式・ソロの年別比較
            </h2>
          </div>
        </div>

        <p
          class="stat-chart-guide"
          id="comparisonDescription"
        >
          選択中の指標を、イベント区分ごとに比較します。
        </p>

        <div class="comparison-grid">
          <div class="comparison-chart-container">
            <canvas
              id="comparisonChart"
              aria-label="公式とソロの比較グラフ"
            ></canvas>
          </div>

          <div
            class="comparison-cards"
            id="comparisonCards"
          ></div>
        </div>

        <div
          class="chart-error"
          id="comparisonError"
          hidden
        ></div>
      </article>

      <article class="stat-table-card">
        <div class="stat-chart-heading">
          <div>
            <p class="kicker">
              YEARLY VALUES
            </p>

            <h2>年別数値一覧</h2>
          </div>
        </div>

        <p class="stat-chart-guide">
          グラフを読み込みにくい環境でも、数値は一覧で確認できます。
        </p>

        <div
          class="stat-fallback"
          id="statisticsTable"
        ></div>
      </article>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
  ></script>

  <script
    type="module"
    src="assets/js/statistics-v330.js?v=3.3.0"
  ></script>
</body>
</html>
