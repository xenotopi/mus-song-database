<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Feature Launch｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <style>
    .launch-card {
      grid-template-rows: 64px minmax(0, 1fr) 78px;
      gap: 38px;
      background: #f7f9fd;
    }
    .launch-card::before { border-color: #d6e9f2; }
    .launch-card .brand-lockup__mu { color: #2b65b1; }
    .launch-card .card-series { color: #2b65b1; border-color: #cde5f1; }
    .launch-stage {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 38px;
      min-height: 0;
      padding: 58px 56px 52px;
      border-radius: 30px;
      background: #192c4b;
    }
    .launch-hero {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      padding: 58px 36px 48px;
      border: 1px solid #cde5f1;
      border-radius: 24px;
      background: #fff;
      box-shadow: inset 0 7px 0 #5b9ec2, 0 18px 36px rgba(12, 29, 53, .12);
    }
    .launch-hero__series {
      margin: 0 0 30px;
      color: #5b9ec2;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .14em;
    }
    .launch-headline { min-width: 0; }
    .launch-hero__title {
      margin: 0;
      min-width: 0;
      color: #192c4b;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -.06em;
    }
    .launch-hero__title-text {
      display: inline-block;
      white-space: nowrap;
    }
    .launch-hero__announcement {
      display: grid;
      grid-template-columns: 6px 1fr;
      column-gap: 22px;
      justify-items: start;
      margin-top: 48px;
    }
    .launch-hero__announcement::before {
      grid-row: 1 / 3;
      width: 6px;
      height: 100%;
      border-radius: 6px;
      background: #5b9ec2;
      content: "";
    }
    .launch-hero__badge {
      grid-column: 2;
      padding: 5px 12px 4px;
      border-radius: 4px;
      color: #fff;
      background: #5b9ec2;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .07em;
    }
    .launch-hero__status {
      grid-column: 2;
      margin: 8px 0 0;
      color: #192c4b;
      font-size: 35px;
      font-weight: 900;
    }
    .launch-details {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-top: 56px;
    }
    .launch-hero__description {
      margin: 0;
      color: #374b66;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.58;
      white-space: pre-line;
    }
    .launch-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
      min-width: 0;
      margin-top: auto;
      padding: 30px 36px;
      border: 1px solid #cde5f1;
      border-radius: 18px;
      background: #eef8fc;
    }
    .launch-metric {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 13px;
      min-width: 0;
      white-space: nowrap;
    }
    .launch-metric + .launch-metric {
      border-left: 2px solid #cde5f1;
    }
    .launch-metric__value {
      color: #192c4b;
      font-size: 69px;
      font-weight: 900;
      line-height: 1;
    }
    .launch-metric__label {
      color: #192c4b;
      font-size: 25px;
      font-weight: 800;
    }
    .launch-scope {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 70px;
      color: #eef8fc;
      font-size: 34px;
      font-weight: 800;
    }
    .launch-scope::before {
      width: 7px;
      height: 48px;
      border-radius: 999px;
      background: #5b9ec2;
      content: "";
    }
    .launch-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px solid #d6dae3;
      color: #6b7280;
      font-size: 19px;
      font-weight: 700;
    }
    .launch-footer strong { color: #172033; font-size: 23px; font-weight: 900; }
  </style>
</head>
<body>
  <main class="post-card launch-card" aria-label="サイト機能・特設ページ公開告知カード">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span>
      </div>
      <span class="card-series" id="series-top"></span>
    </header>
    <section class="launch-stage">
      <div class="launch-hero">
        <div class="launch-headline">
          <p class="launch-hero__series" id="series"></p>
          <h1 class="launch-hero__title"><span class="launch-hero__title-text" id="title"></span></h1>
          <div class="launch-hero__announcement"><span class="launch-hero__badge" id="badge"></span><p class="launch-hero__status" id="status"></p></div>
        </div>
        <div class="launch-details">
          <p class="launch-hero__description" id="description"></p>
          <div class="launch-metrics" id="metrics" aria-label="主要情報"></div>
        </div>
      </div>
      <div class="launch-scope" id="scope"></div>
    </section>
    <footer class="launch-footer"><span>μ'sの記録をたどる。</span><strong>μ's Song Database</strong></footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>
    const card = window.MusdbPostCard.readCard({ id: "", series: "", title: "", badge: "", status: "", description: "", metrics: "[]", scope: "" });
    document.title = `${card.id}｜μ's Song Database`;
    window.MusdbPostCard.bindText({ "series-top": card.series, series: card.series, title: card.title, badge: card.badge, status: card.status, description: card.description, scope: card.scope });
    const host = document.getElementById("metrics");
    for (const metric of JSON.parse(card.metrics)) {
      const item = document.createElement("div");
      item.className = "launch-metric";
      const value = document.createElement("strong");
      value.className = "launch-metric__value";
      value.textContent = metric.value;
      const label = document.createElement("span");
      label.className = "launch-metric__label";
      label.textContent = metric.label;
      item.append(value, label);
      host.append(item);
    }
    window.MusdbPostCard.finish();
  </script>
</body>
</html>
