<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>最初の公式歌唱記録｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <style>
    .first-record-card { grid-template-rows: 66px 260px minmax(0, 1fr) 73px; gap: 35px; background: #f7f9fd; }
    .first-record-card::before { border-color: #d6e5f0; }
    .first-record-card .brand-lockup__mu, .first-record-card .card-series { color: #2b65b1; }
    .first-record-card .card-series { border-color: #cde2f0; }
    .first-record-title { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 36px 42px; border-radius: 28px; background: #192c4b; color: #fff; }
    .first-record-title__label { margin: 0 0 22px; color: #a9d4eb; font-size: 20px; font-weight: 800; letter-spacing: .12em; }
    .first-record-title h1 { max-height: 128px; margin: 0; overflow: hidden; font-size: 78px; font-weight: 900; line-height: 1.15; letter-spacing: -.055em; white-space: nowrap; }
    .first-record-content { display: grid; grid-template-rows: auto auto 1fr; gap: 0; min-height: 0; padding: 42px 45px 39px; border: 1px solid #cfe1ee; border-radius: 28px; background: #fff; box-shadow: 0 18px 40px rgba(25, 44, 75, .075); }
    .first-record-premise { padding: 0 0 32px; border-bottom: 1px solid #d6e5f0; }
    .first-record-premise__scope { margin: 0 0 10px; color: #397da6; font-size: 25px; font-weight: 900; }
    .first-record-premise__claim { margin: 0; color: #192c4b; font-size: 42px; font-weight: 900; line-height: 1.3; }
    .first-record-reveal { padding: 29px 0 32px; }
    .first-record-reveal__contrast { margin: 0 0 17px; color: #53657b; font-size: 27px; font-weight: 700; }
    .first-record-reveal__highlight { display: flex; align-items: center; justify-content: space-between; padding: 22px 30px 24px; border-left: 9px solid #5b9ec2; border-radius: 5px 18px 18px 5px; background: #eaf5fb; }
    .first-record-reveal__highlight strong { color: #17395a; font-size: 79px; font-weight: 900; line-height: 1.14; letter-spacing: -.05em; }
    .first-record-reveal__highlight span { color: #397da6; font-size: 22px; font-weight: 800; }
    .first-record-evidence { display: grid; grid-template-columns: 220px 1fr; align-content: center; gap: 12px 28px; min-height: 0; padding: 28px 30px; border: 1px solid #dce8f0; border-radius: 18px; background: #fafcfe; }
    .first-record-evidence__date { grid-column: 1; grid-row: 1 / 4; margin: 0; color: #2b65b1; font-size: 30px; font-weight: 900; white-space: nowrap; }
    .first-record-evidence__event { grid-column: 2; margin: 0; color: #192c4b; font-size: 28px; font-weight: 900; line-height: 1.34; overflow-wrap: normal; word-break: keep-all; }
    .first-record-evidence__meta { grid-column: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 9px 22px; margin: 0; color: #53657b; font-size: 24px; font-weight: 700; }
    .first-record-footer { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 20px; border-top: 1px solid #d6dae3; color: #667487; font-size: 19px; font-weight: 700; }
    .first-record-footer strong { color: #192c4b; font-size: 22px; font-weight: 900; }
  </style>
</head>
<body>
  <main class="post-card first-record-card" aria-label="最初の公式歌唱記録カード">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database"><span class="brand-lockup__mu">μ</span><span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span></div>
      <span class="card-series">SONG RECORD</span>
    </header>
    <section class="first-record-title">
      <p class="first-record-title__label">楽曲</p>
      <h1 id="song" class="fit-text" data-min-size="55"></h1>
    </section>
    <section class="first-record-content">
      <div class="first-record-premise"><p class="first-record-premise__scope">現行DB</p><h2 class="first-record-premise__claim">最初の公式歌唱記録</h2></div>
      <div class="first-record-reveal"><p id="contrast" class="first-record-reveal__contrast"></p><div class="first-record-reveal__highlight"><strong id="eventHighlight" class="fit-text" data-min-size="50"></strong><span id="eventType"></span></div></div>
      <div class="first-record-evidence"><time id="date" class="first-record-evidence__date"></time><p id="event" class="first-record-evidence__event fit-text" data-min-size="22"></p><p class="first-record-evidence__meta"><span id="singer"></span><span id="venue"></span></p></div>
    </section>
    <footer class="first-record-footer"><span>現行DB登録分の公式歌唱記録</span><strong>μ's Song Database</strong></footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>
    const card = window.MusdbPostCard.readCard({ id: "", song: "", date: "", event: "", eventHighlight: "", contrast: "", singer: "", venue: "", eventType: "" });
    window.MusdbPostCard.bindText({ song: card.song, date: card.date, event: card.event, eventHighlight: card.eventHighlight, contrast: card.contrast, singer: card.singer, venue: card.venue, eventType: card.eventType });
    document.title = `${card.id} 最初の公式歌唱記録｜μ's Song Database`;
    window.MusdbPostCard.finish();
  </script>
</body>
</html>
