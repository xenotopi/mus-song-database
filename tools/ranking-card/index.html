<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ランキングカード｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="ranking-card.css">
</head>
<body>
  <main id="rankingCard" class="post-card ranking-card" aria-label="ランキング 投稿カード">
    <div class="post-card__orb post-card__orb--top" aria-hidden="true"></div>
    <div class="post-card__orb post-card__orb--bottom" aria-hidden="true"></div>

    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy">
          <strong>'s Song Database</strong>
          <small>μ's歌唱履歴データベース</small>
        </span>
      </div>
    </header>

    <section class="ranking-card__intro">
      <h1 id="cardTitle" class="fit-text" data-min-size="36">公式歌唱数ランキング</h1>
    </section>

    <section class="card-surface ranking-card__content">
      <ol class="ranking-list" aria-label="1位から5位">
        <li class="ranking-row ranking-row--first">
          <span class="ranking-row__rank" aria-label="1位">01</span>
          <h2 id="rank1Name" class="ranking-row__name fit-text" data-min-size="32">ミはμ'sicのミ</h2>
          <strong class="ranking-row__value fit-text" data-min-size="42"><span id="rank1Count">53</span><small id="rank1Unit">回</small></strong>
        </li>
        <li class="ranking-row">
          <span class="ranking-row__rank" aria-label="2位">02</span>
          <h2 id="rank2Name" class="ranking-row__name fit-text" data-min-size="28">Snow halation</h2>
          <strong class="ranking-row__value fit-text" data-min-size="28"><span id="rank2Count">51</span><small id="rank2Unit">回</small></strong>
        </li>
        <li class="ranking-row">
          <span class="ranking-row__rank" aria-label="3位">03</span>
          <h2 id="rank3Name" class="ranking-row__name fit-text" data-min-size="28">僕らは今のなかで</h2>
          <strong class="ranking-row__value fit-text" data-min-size="28"><span id="rank3Count">48</span><small id="rank3Unit">回</small></strong>
        </li>
        <li class="ranking-row">
          <span class="ranking-row__rank" aria-label="4位">04</span>
          <h2 id="rank4Name" class="ranking-row__name fit-text" data-min-size="28">僕らのLIVE 君とのLIFE</h2>
          <strong class="ranking-row__value fit-text" data-min-size="28"><span id="rank4Count">46</span><small id="rank4Unit">回</small></strong>
        </li>
        <li class="ranking-row">
          <span class="ranking-row__rank" aria-label="5位">05</span>
          <h2 id="rank5Name" class="ranking-row__name fit-text" data-min-size="28">No brand girls</h2>
          <strong class="ranking-row__value fit-text" data-min-size="28"><span id="rank5Count">35</span><small id="rank5Unit">回</small></strong>
        </li>
      </ol>
    </section>

    <footer class="post-card__footer ranking-card__footer">
      <p>記録で見る、μ'sの歌唱履歴。</p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>

  <script src="../card-shared/card-runtime.js"></script>
  <script src="ranking-card.js"></script>
</body>
</html>
