<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sequence Comparison｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <style>
    .sequence-card { display: flex; flex-direction: column; background: #f7f9fd; }
    .intro { margin-top: 64px; }
    .context { margin: 0 0 22px; color: #2b65b1; font-size: 27px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 88px; font-weight: 900; letter-spacing: -.045em; line-height: 1.15; white-space: nowrap; }
    .comparison { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 48px; position: relative; }
    .record { position: relative; min-width: 0; padding: 28px 14px 34px; text-align: center; border-top: 3px solid #aabbd2; border-bottom: 1px solid #cdd8e6; }
    .record:first-child { background: #edf2f9; border-top-color: #2b65b1; border-radius: 12px 0 0 12px; }
    .record + .record { border-left: 1px solid #d4deeb; }
    .record + .record::before { content: '→'; position: absolute; left: -21px; top: 174px; width: 42px; background: #f7f9fd; color: #879bb8; font-size: 32px; line-height: 1.2; }
    .year { font-size: 30px; color: #4b5563; font-weight: 700; }
    .event { margin-top: 8px; font-size: 31px; font-weight: 700; white-space: nowrap; }
    .number { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 28px; }
    .number strong { font-size: 180px; line-height: 1; font-weight: 900; letter-spacing: -.075em; }
    .number span { font-size: 34px; font-weight: 700; }
    .heading { margin: 24px 0 18px; font-size: 30px; font-weight: 800; white-space: nowrap; }
    .details { font-size: 24px; font-weight: 500; color: #4b5563; line-height: 1.65; min-height: 98px; }
    .details span { display: block; white-space: nowrap; }
    .conclusion { margin: 40px 0 0; text-align: center; font-size: 36px; font-weight: 800; line-height: 1.4; }
    .note { margin: 20px 0 0; text-align: center; color: #536176; font-size: 22px; line-height: 1.6; white-space: pre-line; }
    .today { margin-top: auto; padding: 25px 0 23px; border-top: 1px solid #cdd8e6; border-bottom: 1px solid #cdd8e6; }
    .today-head { display: flex; align-items: baseline; gap: 18px; color: #536176; font-size: 24px; font-weight: 700; }
    .today-head strong { letter-spacing: .1em; font-size: 20px; }
    .today-text { margin: 12px 0 0; font-size: 25px; line-height: 1.65; white-space: pre-line; }
    footer { display: flex; justify-content: space-between; margin-top: 24px; font-size: 19px; color: #6b7280; }
    footer strong { color: #172033; font-size: 21px; }
  </style>
</head>
<body>
  <main class="post-card sequence-card">
    <header class="post-card__header">
      <div class="brand-lockup"><span class="brand-lockup__mu">μ</span><span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span></div>
      <span class="card-series">DATABASE RECORD</span>
    </header>
    <section class="intro"><p id="context" class="context"></p><h1 id="title" class="fit-text" data-min-size="65"></h1></section>
    <section id="comparison" class="comparison" aria-label="3記録の比較"></section>
    <p id="conclusion" class="conclusion"></p>
    <p id="note" class="note"></p>
    <aside class="today"><div class="today-head"><strong>TODAY</strong><span id="today-date"></span></div><p id="today-text" class="today-text"></p></aside>
    <footer><span>現行DB登録分｜公式歌唱記録の比較</span><strong>μ's Song Database</strong></footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>
    const card = window.MusdbPostCard.readCard({ id: "", title: "", context: "", conclusion: "", records: "[]", note: "", todayDate: "", todayText: "" });
    document.title = `${card.id}｜μ's Song Database`;
    window.MusdbPostCard.bindText({ title: card.title, context: card.context, conclusion: card.conclusion, note: card.note, "today-date": card.todayDate, "today-text": card.todayText });
    const host = document.getElementById("comparison");
    for (const record of JSON.parse(card.records)) {
      const item = document.createElement("article"); item.className = "record";
      const text = (tag, className, value) => { const el = document.createElement(tag); el.className = className; el.textContent = value; return el; };
      const number = text("div", "number", ""); number.append(text("strong", "", record.value), text("span", "", record.unit));
      const details = text("div", "details", ""); record.details.forEach(line => details.append(text("span", "", line)));
      item.append(text("div", "year", record.year), text("div", "event", record.label), number, text("div", "heading", record.heading), details);
      host.append(item);
    }
    window.MusdbPostCard.finish();
  </script>
</body>
</html>
