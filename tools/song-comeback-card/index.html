<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>歌唱ブランク｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <style>
    .comeback-card { grid-template-rows: 65px 162px 190px 1fr 82px; gap: 28px; background: #f7f9fd; }
    .comeback-card::before { border-color: #dbe5f1; }
    .comeback-card__title-block { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 20px; border-bottom: 2px solid #cfdaea; }
    .comeback-card__eyebrow { margin: 0 0 13px; color: #2b65b1; font-size: 21px; font-weight: 900; letter-spacing: .12em; }
    .comeback-card h1 { margin: 0; color: #172033; font-size: 70px; font-weight: 900; line-height: 1.18; letter-spacing: -.04em; white-space: nowrap; }
    .comeback-card__gap { display: flex; align-items: baseline; justify-content: center; align-self: center; gap: 18px; white-space: nowrap; color: #2b65b1; }
    .comeback-card__gap-value { font-size: 144px; font-weight: 900; letter-spacing: -.07em; line-height: 1; }
    .comeback-card__gap-unit { font-size: 53px; font-weight: 900; }
    .comeback-card__timeline { position: relative; display: grid; grid-template-rows: 1fr 30px 1fr; gap: 10px; min-height: 0; }
    .comeback-card__record { display: grid; grid-template-columns: 220px 1fr; gap: 26px; align-items: center; min-height: 0; padding: 24px 32px; border: 1px solid #cbd9eb; border-radius: 24px; background: #fff; box-shadow: 0 12px 26px rgba(23,32,51,.045); }
    .comeback-card__date { display: flex; flex-direction: column; gap: 15px; align-self: center; }
    .comeback-card__label { color: #5a6880; font-size: 20px; font-weight: 800; letter-spacing: .06em; }
    .comeback-card__date time { color: #2b65b1; font-size: 29px; font-weight: 900; white-space: nowrap; }
    .comeback-card__details { min-width: 0; }
    .comeback-card__event { display: block; margin: 0 0 15px; color: #172033; font-size: 28px; font-weight: 900; line-height: 1.34; white-space: pre-line; overflow-wrap: normal; word-break: keep-all; }
    .comeback-card__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 18px; color: #4b5563; font-size: 21px; font-weight: 700; }
    .comeback-card__category { padding: 5px 13px; border-radius: 999px; color: #2b65b1; background: #eaf3fa; font-size: 19px; font-weight: 800; }
    .comeback-card__note { display: block; margin-top: 7px; color: #5a6880; font-size: 17px; font-weight: 700; }
    .comeback-card__connector { display: flex; align-items: center; justify-content: center; gap: 16px; color: #2b65b1; font-size: 20px; font-weight: 900; }
    .comeback-card__connector::before, .comeback-card__connector::after { width: 130px; height: 1px; background: #bfd2e5; content: ""; }
    .comeback-card__footer { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 20px; border-top: 1px solid #d6dae3; }
    .comeback-card__duration { color: #5a6880; font-size: 25px; font-weight: 800; }
    .comeback-card__footer strong { color: #172033; font-size: 21px; }
  </style>
</head>
<body>
  <main class="post-card comeback-card" aria-label="歌唱ブランク記録カード">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span>
      </div>
      <span class="card-series">SONG INTERVAL</span>
    </header>
    <section class="comeback-card__title-block">
      <p class="comeback-card__eyebrow">歌唱記録のブランク</p>
      <h1 id="songTitle" class="fit-text" data-min-size="45"></h1>
    </section>
    <section class="comeback-card__gap" aria-label="次の歌唱記録までの間隔">
      <strong id="gapDays" class="comeback-card__gap-value"></strong><span class="comeback-card__gap-unit">日ぶり</span>
    </section>
    <section class="comeback-card__timeline" aria-label="前後の歌唱記録">
      <article class="comeback-card__record" data-record="before"></article>
      <div class="comeback-card__connector" aria-hidden="true">↓</div>
      <article class="comeback-card__record" data-record="after"></article>
    </section>
    <footer class="comeback-card__footer"><span id="duration" class="comeback-card__duration"></span><strong>μ's Song Database</strong></footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>
    const card = window.MusdbPostCard.readCard({ id: "", title: "", gapDays: "", duration: "", before: "{}", after: "{}" });
    window.MusdbPostCard.bindText({ songTitle: card.title, gapDays: card.gapDays, duration: card.duration });
    for (const position of ["before", "after"]) {
      const data = JSON.parse(card[position]);
      const host = document.querySelector(`[data-record="${position}"]`);
      const dateBox = document.createElement("div");
      dateBox.className = "comeback-card__date";
      const label = document.createElement("span");
      label.className = "comeback-card__label";
      label.textContent = position === "before" ? "空白前" : "再び記録";
      const time = document.createElement("time");
      time.textContent = data.date;
      dateBox.append(label, time);
      const details = document.createElement("div");
      details.className = "comeback-card__details";
      const event = document.createElement("strong");
      event.className = "comeback-card__event fit-text";
      event.dataset.minSize = "22";
      event.textContent = data.event;
      const meta = document.createElement("div");
      meta.className = "comeback-card__meta";
      const singer = document.createElement("span");
      singer.textContent = data.singer;
      const category = document.createElement("span");
      category.className = "comeback-card__category";
      category.textContent = data.category;
      meta.append(singer, category);
      details.append(event, meta);
      if (data.note) {
        const note = document.createElement("span");
        note.className = "comeback-card__note";
        note.textContent = data.note;
        details.append(note);
      }
      host.append(dateBox, details);
    }
    document.title = `${card.id} 歌唱ブランク｜μ's Song Database`;
    window.MusdbPostCard.finish();
  </script>
</body>
</html>
