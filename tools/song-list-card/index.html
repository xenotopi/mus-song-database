<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Song List｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <style>
    .song-list-card { grid-template-rows: 60px 190px minmax(0, 1fr) 55px; gap: 18px; background: #f7f8fb; }
    .song-list-card::before { border-radius: 18px; border-color: rgba(42,48,78,.12); }
    .series { color: var(--indigo); font-size: 16px; font-weight: 900; letter-spacing: .12em; }
    .intro { text-align: center; padding-top: 12px; }
    .intro h1 { margin: 0; white-space: pre-line; font-size: 55px; font-weight: 900; line-height: 1.22; letter-spacing: -.035em; }
    .intro p { margin: 13px 0 0; color: #4b5265; font-size: 25px; font-weight: 700; }
    .list-surface { min-height: 0; padding: 29px 31px; border: 1px solid #d9dce6; border-radius: 16px; background: #fff; }
    .list-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 31px; height: 100%; }
    .song-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .song-list + .song-list { padding-left: 31px; border-left: 1px solid #d9dce6; }
    .song-list li { display: grid; grid-template-columns: 43px minmax(0, 1fr); gap: 7px; align-items: start; min-height: 45px; }
    .song-list .number { color: var(--indigo); font-size: 23px; font-weight: 900; line-height: 1.28; font-variant-numeric: tabular-nums; }
    .song-list .name { color: var(--navy); font-size: 24px; font-weight: 800; line-height: 1.28; overflow-wrap: anywhere; }
    .post-card__footer { align-self: end; }
    .post-card__footer p { font-size: 16px; }
  </style>
</head>
<body>
  <main class="post-card song-list-card">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span>
      </div>
      <span class="series">SONG RECORD</span>
    </header>
    <section class="intro">
      <h1 id="card-title"></h1>
      <p id="card-subtitle"></p>
    </section>
    <section class="list-surface" aria-label="楽曲一覧">
      <div class="list-columns"><ol class="song-list" id="songs-left"></ol><ol class="song-list" id="songs-right"></ol></div>
    </section>
    <footer class="post-card__footer">
      <p id="footer-note"></p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>
    const card = window.MusdbPostCard.readCard({ id: "", title: "", subtitle: "", songs: "[]", footerNote: "" });
    const songs = JSON.parse(card.songs);
    window.MusdbPostCard.bindText({ "card-title": card.title, "card-subtitle": card.subtitle, "footer-note": card.footerNote });
    document.title = `${card.id}｜μ's Song Database`;
    const split = Math.ceil(songs.length / 2);
    songs.forEach((song, index) => {
      const item = document.createElement("li");
      const number = document.createElement("span");
      const name = document.createElement("span");
      number.className = "number";
      name.className = "name";
      number.textContent = String(index + 1).padStart(2, "0");
      name.textContent = song;
      item.append(number, name);
      document.getElementById(index < split ? "songs-left" : "songs-right").append(item);
    });
    window.MusdbPostCard.finish();
  </script>
</body>
</html>
