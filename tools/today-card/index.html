<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Todayカード｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="today-card.css">
</head>
<body>
  <main id="todayCard" class="post-card today-card" aria-label="今日はμ'sのこんな日 投稿カード">
    <div class="post-card__orb post-card__orb--top" aria-hidden="true"></div>
    <div class="post-card__orb post-card__orb--bottom" aria-hidden="true"></div>

    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy">
          <strong>'s Song Database</strong>
          <small>μ's歌唱履歴データベース</small>
        </span>
      </div>
      <span class="card-series">TODAY IN μ's</span>
    </header>

    <section class="today-card__intro">
      <p class="today-card__eyebrow">今日はμ'sのこんな日</p>
      <h1 id="cardDate">2013年9月1日</h1>
    </section>

    <section id="eventTodayContent" class="card-surface today-card__content">
      <div class="today-card__song">
        <span class="field-label field-label--light">SONG</span>
        <h2 id="cardSong" class="fit-text" data-min-size="46">ダイヤモンドプリンセスの憂鬱</h2>
      </div>

      <div class="today-card__event">
        <span class="field-label">EVENT</span>
        <p id="cardEvent" class="fit-text" data-min-size="26">みもパ！vol.1 第2回</p>
      </div>

      <div class="today-card__details">
        <div class="meta-item meta-item--singer">
          <span class="field-label">歌唱名義</span>
          <strong id="cardSinger">三森すずこ</strong>
        </div>

        <div class="meta-item meta-item--tags">
          <span class="field-label">DETAIL</span>
          <div class="tag-line" aria-label="区分と備考">
            <strong id="cardCategory" class="detail-tag">声優ソロ系</strong>
            <span class="tag-divider" aria-hidden="true"></span>
            <strong id="cardNote" class="detail-tag detail-tag--note">ショートVer.</strong>
          </div>
        </div>
      </div>
    </section>

    <section id="releaseTodayContent" class="card-surface release-today" hidden>
      <div class="release-today__hero">
        <span class="field-label field-label--light">RELEASE</span>
        <h2 id="cardReleaseSong" class="fit-text" data-min-size="50">Wonderful Rush</h2>
        <strong id="cardAnniversary" class="release-today__anniversary">14周年</strong>
      </div>

      <div class="release-today__stats">
        <div class="release-stat">
          <span class="field-label">歌唱記録</span>
          <p><strong id="cardTotalCount">21</strong><span>回</span></p>
        </div>
        <div class="release-stat release-stat--official">
          <span class="field-label">公式歌唱</span>
          <p><strong id="cardOfficialCount">12</strong><span>回</span></p>
        </div>
      </div>

      <div class="release-today__related">
        <span class="field-label">カップリング</span>
        <p><strong id="cardRelatedSong" class="fit-text" data-min-size="28">Oh, Love &amp; Peace!</strong></p>
      </div>
    </section>

    <footer class="post-card__footer">
      <div class="member-line" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <p>記録で見る、μ'sの歌唱履歴。</p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>

  <script src="../card-shared/card-runtime.js"></script>
  <script src="today-card.js"></script>
</body>
</html>
