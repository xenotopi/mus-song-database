<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>2曲比較カード｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="x0029-comparison-card.css">
</head>
<body>
  <main id="comparisonCard" class="post-card comparison-card" aria-label="2曲比較 投稿カード">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy">
          <strong>'s Song Database</strong>
          <small>μ's歌唱履歴データベース</small>
        </span>
      </div>
      <span class="comparison-card__series">DATABASE RECORD</span>
    </header>

    <section class="comparison-card__intro">
      <p>アニメ1期・2期ED</p>
      <h1>歌唱記録を比べてみると…</h1>
    </section>

    <section class="comparison-card__grid" aria-label="2曲の歌唱記録比較">
      <article class="comparison-song">
        <span class="comparison-song__season">1st season ending</span>
        <h2 id="song1" class="fit-text" data-min-size="35">きっと青春が聞こえる</h2>
        <div class="comparison-song__total">
          <span>全歌唱記録</span>
          <strong><b id="total1">35</b><small>件</small></strong>
        </div>
        <dl class="comparison-song__breakdown">
          <div><dt>公式</dt><dd><b id="official1">31</b><small>件</small></dd></div>
          <div><dt>声優ソロ系</dt><dd><b id="solo1">4</b><small>件</small></dd></div>
        </dl>
      </article>

      <div class="comparison-card__equals" aria-label="同じ">＝</div>

      <article class="comparison-song">
        <span class="comparison-song__season">2nd season ending</span>
        <h2 id="song2" class="fit-text" data-min-size="35">どんなときもずっと</h2>
        <div class="comparison-song__total">
          <span>全歌唱記録</span>
          <strong><b id="total2">35</b><small>件</small></strong>
        </div>
        <dl class="comparison-song__breakdown">
          <div><dt>公式</dt><dd><b id="official2">31</b><small>件</small></dd></div>
          <div><dt>声優ソロ系</dt><dd><b id="solo2">4</b><small>件</small></dd></div>
        </dl>
      </article>
    </section>

    <section class="comparison-card__conclusion">
      <span>35 / 31 / 4</span>
      <p>歌唱記録だけでなく<br>内訳まで同じ数字に。</p>
    </section>

    <footer class="post-card__footer comparison-card__footer">
      <p>記録で見る、μ'sの歌唱履歴。</p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script src="x0029-comparison-card.js"></script>
</body>
</html>
