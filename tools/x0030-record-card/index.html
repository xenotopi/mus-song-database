<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>X0030｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="post-card x0030-card">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span>
      </div>
      <span class="series">DATABASE RECORD</span>
    </header>
    <section class="intro">
      <h1 class="fit-text" data-min-size="46">愛してるばんざーい！</h1>
      <p>全<span id="total">45</span>件の歌唱記録のうち</p>
    </section>
    <section class="hero" aria-label="全45件中39件がFinal後">
      <div class="hero-number"><strong id="count">39</strong><span>件</span></div>
      <h2>Final後</h2>
      <div class="ratio" aria-hidden="true"><span></span></div>
      <p>2016年4月1日より後の記録</p>
    </section>
    <section class="first-record">
      <h2>Final後 最初の歌唱記録</h2>
      <p id="firstDate" class="date">2016.06.26</p>
      <div class="performance"><strong id="singer">飯田里穂</strong><span id="note">アカペラ歌唱</span></div>
    </section>
    <p class="continuation">2024〜2025年にも多くの歌唱記録</p>
    <footer class="post-card__footer">
      <p>現行DB登録分｜公式・声優ソロ系の歌唱記録</p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script src="card.js"></script>
</body>
</html>
