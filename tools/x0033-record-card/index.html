<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>X0033｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="../x0030-record-card/card.css">
  <style>
    .x0030-card{grid-template-rows:60px 175px 435px 265px 1fr;gap:20px}
    .intro h1{font-size:57px}
    .intro p{margin-top:18px;font-size:29px}
    .hero-number strong{font-size:226px}
    .hero h2{margin:6px 0 22px;font-size:42px}
    .record-breakdown{display:flex;gap:52px;color:#4b5265;font-size:27px;font-weight:800}
    .record-breakdown strong{color:var(--navy);font-size:34px}
    .first-record{padding:25px 38px}
    .first-record h2{font-size:24px}
    .first-record .date{font-size:48px}
    .performance strong{font-size:35px}
  </style>
</head>
<body>
  <main class="post-card x0030-card">
    <header class="post-card__header">
      <div class="brand-lockup" aria-label="μ's Song Database">
        <span class="brand-lockup__mu">μ</span>
        <span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span>
      </div>
      <span class="series">SONG RECORD</span>
    </header>
    <section class="intro">
      <h1 class="fit-text" data-min-size="46">もぎゅっと“love”で接近中！</h1>
      <p>全23件の歌唱記録</p>
    </section>
    <section class="hero" aria-label="声優ソロ系の歌唱記録1件">
      <div class="hero-number"><strong>1</strong><span>件</span></div>
      <h2>声優ソロ系</h2>
      <div class="record-breakdown"><span>公式 <strong>22</strong>件</span><span>声優ソロ系 <strong>1</strong>件</span></div>
    </section>
    <section class="first-record">
      <h2>声優ソロ系 唯一の記録</h2>
      <p class="date">2019.02.11</p>
      <div class="performance"><strong class="fit-text" data-min-size="26">キャラソンJAPAN 東京公演</strong></div>
      <div class="performance"><span>徳井青空</span></div>
    </section>
    <footer class="post-card__footer">
      <p>現行DB登録分｜公式・声優ソロ系の歌唱記録</p>
      <strong>μ's Song Database</strong>
    </footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>window.MusdbPostCard.finish();</script>
</body>
</html>
