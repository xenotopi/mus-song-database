<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>X0035｜μ's Song Database</title>
  <link rel="stylesheet" href="../card-shared/card-brand.css">
  <link rel="stylesheet" href="../x0031-record-card/card.css">
  <style>
    .post-card{grid-template-rows:60px 150px 445px 330px 1fr;gap:24px}
    .heading h1{font-size:73px}
    .duet{padding:38px 34px;border-radius:16px}
    .duet .date{font-size:44px}
    .duet .event{margin:14px 0 34px;font-size:29px;font-weight:800;color:#33366d}
    .duet h2{margin:18px 0 10px;font-size:57px}
    .timeline{display:block;padding:34px 38px;background:#fff;border-left:5px solid #4f46e5;border-radius:8px 18px 18px 8px}
    .timeline::before,.step::before{display:none}
    .step{display:block;border:0}
    .timeline .period{font-size:37px}
    .timeline .performers{justify-content:flex-start;padding:0;margin-top:13px;font-size:41px}
    .timeline .song-title{margin:15px 0 0;color:#33366d;font-size:26px;font-weight:800}
    .timeline .detail{margin:4px 0 0;color:#535d77;font-size:25px;font-weight:700}
  </style>
</head>
<body>
  <main class="post-card">
    <header class="post-card__header"><div class="brand-lockup" aria-label="μ's Song Database"><span class="brand-lockup__mu">μ</span><span class="brand-lockup__copy"><strong>'s Song Database</strong><small>μ's歌唱履歴データベース</small></span></div><span class="series">DATABASE RECORD</span></header>
    <section class="heading"><p>歌唱記録をたどる</p><h1>Love marginal</h1></section>
    <section class="duet" aria-label="2014年1月18日の2人歌唱">
      <p class="date">2014.01.18</p>
      <p class="event">ANIMAX MUSIX 2014 TAIWAN</p>
      <h2>南條愛乃<span>・</span>三森すずこ</h2>
      <p class="duet-label">2人で歌唱</p>
    </section>
    <section class="timeline" aria-label="2014年7月11日のアコースティックカバー"><div class="step"><div class="period">2014.07.11</div><div class="performers">南條愛乃</div><p class="song-title">Love marginal</p><p class="detail">アコースティックカバー</p></div></section>
    <footer class="post-card__footer"><p>記録で見る、μ'sの歌唱履歴。</p><strong>μ's Song Database</strong></footer>
  </main>
  <script src="../card-shared/card-runtime.js"></script>
  <script>window.MusdbPostCard.finish();</script>
</body>
</html>
