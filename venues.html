<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>会場一覧｜μ's Song Database</title>
  <meta name="description" content="μ'sの楽曲・イベント・会場・歌唱名義から、これまでの歌唱履歴を検索・閲覧できる非公式ファンデータベース。">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://xenotopi.github.io/mus-song-database/venues.html">
  <meta property="og:site_name" content="μ's Song Database">
  <meta property="og:title" content="会場一覧｜μ's Song Database">
  <meta property="og:description" content="μ'sの楽曲・イベント・会場・歌唱名義から、これまでの歌唱履歴を検索・閲覧できる非公式ファンデータベース。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xenotopi.github.io/mus-song-database/venues.html">
  <meta property="og:image" content="https://xenotopi.github.io/mus-song-database/assets/images/og-default-v2.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="μ's Song Database｜μ's歌唱履歴データベース">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="会場一覧｜μ's Song Database">
  <meta name="twitter:description" content="μ'sの楽曲・イベント・会場・歌唱名義から、これまでの歌唱履歴を検索・閲覧できる非公式ファンデータベース。">
  <meta name="twitter:image" content="https://xenotopi.github.io/mus-song-database/assets/images/og-default-v2.png">
  <meta name="twitter:image:alt" content="μ's Song Database｜μ's歌唱履歴データベース">
  <link rel="stylesheet" href="assets/css/style.css?v=4.7.0">

  <style>
    .venues-page{
      width:min(1120px,calc(100% - 32px));
      margin:0 auto;
      padding:30px 0 88px;
    }

    .venues-breadcrumb{
      margin-bottom:18px;
      color:var(--muted);
      font-size:12px;
    }

    .venues-breadcrumb a{
      color:inherit;
      text-decoration:none;
    }

    .venues-breadcrumb a:hover{
      color:var(--indigo);
      text-decoration:underline;
    }

    .venues-hero{
      position:relative;
      overflow:hidden;
      padding:32px 30px;
      border-radius:24px;
      color:#fff;
      background:
        radial-gradient(
          circle at 88% 8%,
          rgba(126,111,255,.20),
          transparent 27%
        ),
        linear-gradient(
          135deg,
          #18213d 0%,
          #293263 54%,
          #5147c9 100%
        );
      box-shadow:
        0 18px 46px
        rgba(30,34,76,.12);
    }

    .venues-hero-kicker,
    .venues-section-kicker{
      margin:0;
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
    }

    .venues-hero-kicker{
      color:rgba(255,255,255,.66);
    }

    .venues-hero h1{
      margin:8px 0 10px;
      font-size:
        clamp(30px,4vw,46px);
      line-height:1.15;
      letter-spacing:-.02em;
    }

    .venues-hero-copy{
      margin:0;
      color:rgba(255,255,255,.86);
      font-size:14px;
      line-height:1.9;
    }

    .venues-hero-summary{
      margin-top:20px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .venues-hero-chip{
      padding:7px 11px;
      border:
        1px solid
        rgba(255,255,255,.18);
      border-radius:999px;
      background:
        rgba(255,255,255,.08);
      font-size:11px;
      font-weight:900;
    }

    .venues-status{
      margin-top:18px;
      padding:18px;
      border:
        1px solid
        var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--muted);
      text-align:center;
    }

    .venues-section{
      margin-top:50px;
    }

    .venues-section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:16px;
    }

    .venues-section-kicker{
      color:var(--indigo);
    }

    .venues-section-head h2{
      margin:5px 0 0;
      color:var(--navy);
      font-size:26px;
      line-height:1.35;
    }

    .venues-section-note{
      margin:0;
      color:var(--muted);
      font-size:11px;
      line-height:1.7;
    }

    .venues-pickup-grid{
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .venue-pickup-card{
      min-height:190px;
      padding:20px;
      border:
        1px solid
        #dedaf5;
      border-radius:20px;
      background:
        radial-gradient(
          circle at 100% 0,
          rgba(79,70,229,.08),
          transparent 42%
        ),
        #fff;
      box-shadow:
        0 8px 24px
        rgba(38,39,77,.055);
      color:inherit;
      text-decoration:none;
    }

    .venue-pickup-card:hover{
      border-color:#bbb6f5;
      transform:translateY(-1px);
    }

    .venue-pickup-label{
      color:var(--indigo);
      font-size:10px;
      font-weight:900;
      letter-spacing:.06em;
    }

    .venue-pickup-title{
      margin-top:14px;
      color:var(--navy);
      font-size:19px;
      font-weight:900;
      line-height:1.45;
    }

    .venue-pickup-value{
      margin-top:15px;
      color:var(--indigo);
      font-size:23px;
      font-weight:900;
      line-height:1.2;
    }

    .venue-pickup-meta{
      margin-top:8px;
      color:var(--muted);
      font-size:11px;
      line-height:1.65;
    }

    .venues-direct-select{
      padding:16px;
      margin-bottom:14px;
      border:1px solid #dcdcff;
      border-radius:18px;
      background:#fbfbff;
    }
    .venues-direct-select label{
      display:block;
      margin-bottom:8px;
      font-size:13px;
      font-weight:800;
      color:#17213b;
    }
    .venues-direct-select select{
      width:100%;
      min-height:46px;
      padding:0 14px;
      border:1px solid #dfe2ea;
      border-radius:13px;
      background:#fff;
      color:#17213b;
      font:inherit;
      font-weight:700;
    }
    .venues-direct-select-note{
      margin:7px 0 0;
      font-size:11px;
      color:#7b8190;
    }

    .venues-toolbar{
      padding:18px;
      border:
        1px solid
        #dedaf5;
      border-radius:20px;
      background:#fbfaff;
      box-shadow:
        0 8px 24px
        rgba(38,39,77,.04);
    }

    .venues-search{
      position:relative;
    }

    .venues-search input{
      width:100%;
      min-height:48px;
      padding:
        0 15px 0 42px;
      border:
        1px solid
        var(--line);
      border-radius:14px;
      background:#fff;
      color:var(--navy);
      font-size:14px;
      font-weight:800;
    }

    .venues-search-mark{
      position:absolute;
      left:15px;
      top:50%;
      transform:
        translateY(-50%);
      color:var(--muted);
      font-size:16px;
      pointer-events:none;
    }

    .venues-scope{
      margin-top:16px;
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .venues-pill{
      min-height:36px;
      padding:0 13px;
      border:
        1px solid
        var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--navy);
      font-size:11px;
      font-weight:900;
      cursor:pointer;
    }

    .venues-pill.active{
      border-color:var(--indigo);
      background:var(--indigo);
      color:#fff;
    }

    .venues-filter-grid{
      margin-top:16px;
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:12px;
    }

    .venues-select{
      display:grid;
      gap:6px;
    }

    .venues-select label{
      color:var(--muted);
      font-size:10px;
      font-weight:900;
    }

    .venues-select select{
      width:100%;
      min-height:42px;
      padding:0 12px;
      border:
        1px solid
        var(--line);
      border-radius:11px;
      background:#fff;
      color:var(--navy);
      font-weight:800;
    }

    .venues-result{
      margin-top:14px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
    }

    .venues-list{
      margin-top:16px;
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .venue-list-card{
      position:relative;
      display:block;
      min-height:176px;
      padding:18px;
      border:
        1px solid
        #dfdced;
      border-radius:18px;
      background:#fff;
      box-shadow:
        0 7px 20px
        rgba(38,39,77,.045);
      color:inherit;
      text-decoration:none;
    }

    .venue-list-card:hover{
      border-color:#bbb6f5;
      background:#fcfbff;
      transform:translateY(-1px);
    }

    .venue-list-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .venue-list-rank{
      flex:0 0 auto;
      min-width:32px;
      height:32px;
      display:grid;
      place-items:center;
      padding:0 8px;
      border-radius:999px;
      background:
        var(--indigo-soft);
      color:var(--indigo);
      font-size:10px;
      font-weight:900;
    }

    .venue-list-title{
      flex:1;
      color:var(--navy);
      font-size:17px;
      font-weight:900;
      line-height:1.45;
    }

    .venue-list-location{
      margin-top:6px;
      color:#5f687b;
      font-size:11px;
      font-weight:800;
      line-height:1.6;
    }

    .venue-list-stats{
      margin-top:14px;
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap:8px;
    }

    .venue-list-stat{
      padding:9px;
      border-radius:10px;
      background:#f7f7fc;
    }

    .venue-list-stat b{
      display:block;
      color:var(--navy);
      font-size:12px;
      line-height:1.3;
    }

    .venue-list-stat span{
      display:block;
      margin-top:3px;
      color:#6b7485;
      font-size:9px;
      font-weight:700;
      line-height:1.35;
    }

    .venue-record-tag{
      margin-top:11px;
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 9px;
      border-radius:999px;
      background:#efedff;
      color:var(--indigo);
      font-size:10px;
      font-weight:900;
    }

    .venues-more-wrap{
      margin-top:18px;
      text-align:center;
    }

    .venues-more{
      min-width:230px;
      min-height:44px;
      padding:0 18px;
      border:
        1px solid
        var(--indigo);
      border-radius:999px;
      background:#fff;
      color:var(--indigo);
      font-weight:900;
      cursor:pointer;
    }

    .venues-more:hover{
      background:var(--indigo);
      color:#fff;
    }

    .venues-empty{
      padding:24px;
      border:
        1px solid
        var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--muted);
      text-align:center;
    }

    @media(max-width:900px){
      .venues-pickup-grid{
        grid-template-columns:1fr;
      }

      .venues-list{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:620px){
      .venues-page{
        width:
          min(100% - 20px,1120px);
        padding-top:20px;
      }

      .venues-hero{
        padding:26px 20px;
        border-radius:20px;
      }

      .venues-hero h1{
        font-size:31px;
      }

      .venues-section{
        margin-top:42px;
      }

      .venues-section-head{
        display:block;
      }

      .venues-section-head h2{
        font-size:22px;
      }

      .venues-section-note{
        margin-top:7px;
      }

      .venues-toolbar{
        padding:14px;
      }

      .venues-filter-grid{
        grid-template-columns:1fr;
      }

      .venue-list-card{
        min-height:0;
        padding:15px 14px;
      }

      .venue-list-title{
        font-size:15px;
      }

      .venue-list-stats{
        grid-template-columns:
          repeat(3,minmax(0,1fr));
      }

      .venue-list-stat{
        padding:7px 6px;
      }

      .venue-list-stat b{
        font-size:10px;
      }

      .venue-list-stat span{
        font-size:8px;
      }
    }
  </style>
</head>

<body>
  <div id="siteHeader"></div>

  <main class="venues-page">
    <div class="venues-breadcrumb">
      <a href="index.html">ホーム</a>
      › 会場一覧
    </div>

    <section class="venues-hero">
      <p class="venues-hero-kicker">
        VENUES
      </p>

      <h1>
        μ's楽曲が歌われた場所
      </h1>

      <p class="venues-hero-copy">
        μ'sの歩んだ足跡を、<br>
        歌唱記録が残る場所から巡ります。
      </p>

      <div
        class="venues-hero-summary"
        id="heroSummary"
        hidden
      >
        <span
          class="venues-hero-chip"
          id="totalVenuesChip"
        ></span>

        <span
          class="venues-hero-chip"
          id="prefectureChip"
        ></span>

        <span
          class="venues-hero-chip"
          id="countryChip"
        ></span>
      </div>
    </section>

    <div
      class="venues-status"
      id="status"
    >
      会場データを読み込んでいます...
    </div>

    <section
      class="venues-section"
      id="pickupSection"
      hidden
    >
      <div class="venues-section-head">
        <div>
          <p class="venues-section-kicker">
            PICK UP VENUES
          </p>
          <h2>記録から場所を見つける</h2>
        </div>

        <p class="venues-section-note">
          よく使われた場所・最初の場所・最近の場所から巡れます。
        </p>
      </div>

      <div
        class="venues-pickup-grid"
        id="pickupGrid"
      ></div>
    </section>

    <section
      class="venues-section"
      id="allVenuesSection"
      hidden
    >
      <div class="venues-section-head">
        <div>
          <p class="venues-section-kicker">
            ALL VENUES
          </p>
          <h2>会場から巡る</h2>
        </div>

        <p class="venues-section-note">
          会場名・地域・国・開催数から探せます。
        </p>
      </div>

      <div class="venues-direct-select">
        <label for="allVenueSelect">全会場から直接選ぶ</label>
        <select id="allVenueSelect" aria-label="全会場から直接選ぶ">
          <option value="">会場を選択してください</option>
        </select>
        <p class="venues-direct-select-note">選択すると、その会場の詳細ページを直接開きます。</p>
      </div>

      <div class="venues-toolbar">
        <div class="venues-search">
          <span class="venues-search-mark">
            ⌕
          </span>

          <input
            id="venueSearch"
            type="search"
            placeholder="会場名・都市名から探す"
            autocomplete="off"
            aria-label="会場名・都市名から探す"
          >
        </div>

        <div
          class="venues-scope"
          id="scopeFilters"
        >
          <button
            type="button"
            class="venues-pill active"
            data-scope=""
          >すべて</button>

          <button
            type="button"
            class="venues-pill"
            data-scope="japan"
          >日本</button>

          <button
            type="button"
            class="venues-pill"
            data-scope="overseas"
          >海外</button>
        </div>

        <div class="venues-filter-grid">
          <div class="venues-select">
            <label for="prefectureSelect">
              都道府県・都市
            </label>

            <select id="prefectureSelect">
              <option value="">
                すべて
              </option>
            </select>
          </div>

          <div class="venues-select">
            <label for="countrySelect">
              国
            </label>

            <select id="countrySelect">
              <option value="">
                すべて
              </option>
            </select>
          </div>

          <div class="venues-select">
            <label for="venueSort">
              並び替え
            </label>

            <select id="venueSort">
              <option value="events">
                イベント数が多い順
              </option>

              <option value="songs">
                歌唱曲数が多い順
              </option>

              <option value="recent">
                最近歌われた順
              </option>

              <option value="first">
                初登場が古い順
              </option>

              <option value="name">
                会場名順
              </option>
            </select>
          </div>
        </div>

        <div
          class="venues-result"
          id="resultText"
        ></div>
      </div>

      <div
        class="venues-list"
        id="venuesList"
      ></div>

      <div class="venues-more-wrap">
        <button
          class="venues-more"
          id="moreButton"
          type="button"
          hidden
        >
          もっと見る
        </button>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script
    type="module"
    src="assets/js/venues-v470.js?v=4.9.1"
  ></script>
</body>
</html>
